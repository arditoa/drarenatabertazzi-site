<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Controle de Pacientes · Dra. Renata Bertazzi</title>
<link rel="icon" type="image/png" href="../img/simbolo.png">
<link rel="apple-touch-icon" href="../img/simbolo-grande.png">
<meta name="theme-color" content="#163f78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root {
  /* Portal interno: mesma identidade do site (azul do logo + off-white), denso e operacional, pensado para o celular da secretária. */
  --ink:#18294a; --soft:#5b687c; --paper:#f6f4ef; --surface:#fff; --line:#e4ddd0;
  --accent:#1f5aa6; --deep:#163f78; --sage:#4f8a73; --sage-soft:#e3eee8;
  --late:#b4412f; --late-soft:#fbe6e1; --warn:#a86a12; --warn-soft:#fbefd9; --ok:#2f7a55; --ok-soft:#e1f1e8;
  --display:"Marcellus", Georgia, serif; --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-weight:400}
h1,h2{font-family:var(--display)}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 18px;background:linear-gradient(180deg,#efe7da,var(--paper))}
.login-card{width:min(100%,400px);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 22px;display:grid;gap:16px;box-shadow:0 30px 60px -40px rgba(24,41,74,.5)}
.login-card img{width:52px;height:52px;justify-self:center}
.login-card h1{text-align:center;font-size:1.5rem;color:var(--accent)}
.login-card p{margin:0;text-align:center;color:var(--soft);font-size:.92rem}
label{display:grid;gap:6px;font-size:.86rem;font-weight:700;color:var(--soft)}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:700;background:var(--accent);color:#fff;min-height:48px}
.btn:hover{background:var(--deep)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.small{min-height:36px;padding:7px 13px;font-size:.88rem}
.btn.okb{background:var(--ok)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:4px}
.msg{font-size:.9rem;border-radius:10px;padding:10px 12px}
.msg.err{background:var(--late-soft);color:var(--late)}
.msg.info{background:var(--sage-soft);color:#2f5f4c}

/* App */
.app{min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;background:var(--deep);color:#fff;padding:12px 16px calc(12px);display:flex;align-items:center;gap:10px}
.top img{width:30px;height:30px;background:#fff;border-radius:50%;padding:2px}
.top .t{flex:1;min-width:0}
.top b{display:block;font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.03em}
.top span{display:block;font-size:.75rem;color:#c8d7ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .out{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px;font-size:.82rem}
main{max-width:1480px;margin:0 auto;padding:16px 14px 24px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:.74rem;font-weight:700;color:var(--soft);padding:6px 2px;border-radius:12px}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);background:#e8f0fa}
@media (min-width:900px){
  .tabs{position:sticky;top:54px;bottom:auto;border:0;border-bottom:1px solid var(--line);grid-template-columns:repeat(4,max-content);gap:6px;justify-content:center;background:var(--paper);padding:8px}
  .tabs button{grid-auto-flow:column;gap:8px;font-size:.9rem;padding:8px 16px}
  .app{padding-bottom:0}
}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:6px 0 12px}
.sec-head h2{font-size:1.45rem}
.sub{color:var(--soft);font-size:.88rem}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:2px;text-align:left;border-left:5px solid var(--accent)}
.kpi b{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1}
.kpi span{font-size:.82rem;color:var(--soft);font-weight:600}
.kpi.late{border-left-color:var(--late)} .kpi.late b{color:var(--late)}
.kpi.warn{border-left-color:var(--warn)} .kpi.warn b{color:var(--warn)}
.kpi.ok{border-left-color:var(--ok)}

/* Lista/cartões */
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.item.late{border-left:5px solid var(--late)} .item.warn{border-left:5px solid var(--warn)} .item.okc{border-left:5px solid var(--ok)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-weight:700;font-size:1rem;flex:1;min-width:0}
.name button{background:none;border:0;padding:0;font-weight:700;text-align:left;color:var(--ink)}
.meta{font-size:.86rem;color:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 9px;background:#eef1f5;color:var(--soft);white-space:nowrap}
.chip.late{background:var(--late-soft);color:var(--late)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.blue{background:#e5eefa;color:var(--accent)} .chip.sage{background:var(--sage-soft);color:#2f5f4c}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);display:inline-block}
.dots i.on{background:var(--accent)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.contact{display:flex;gap:6px}
.contact a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:.82rem;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink);background:#fff}
.contact a.wa{color:#1f7a4a}
.empty{color:var(--soft);font-size:.92rem;padding:14px;border:1.5px dashed var(--line);border-radius:14px;text-align:center}
.group-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700;font-size:.95rem}
.group-title .count{font-size:.78rem;color:var(--soft);font-weight:700;background:#e9e4da;border-radius:999px;padding:1px 8px}

/* Filtros */
.filters{display:grid;gap:8px;margin-bottom:12px}
@media(min-width:760px){.filters{grid-template-columns:2fr 1fr 1fr}}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.seg button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:.86rem;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* Pipeline (kanban) */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
@media(min-width:900px){.board{grid-auto-columns:minmax(250px,1fr)}}
.col h3 .count{flex:none;margin-left:8px}
.col{scroll-snap-align:start;background:#ece7de;border-radius:18px;padding:10px;display:grid;gap:8px;align-content:start;min-height:200px}
.col h3{font-weight:700;font-size:.92rem;display:flex;justify-content:space-between;padding:4px 4px 2px}

.loc-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.lchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.85rem;color:var(--ink)}
.lchip small{color:var(--soft);font-weight:600;margin-left:2px}
.lchip.on{background:var(--accent);border-color:var(--accent);color:#fff} .lchip.on small{color:#dbe7f7}
.inj-box{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:8px}
.inj-list{display:grid}
.inj-row{display:grid;grid-template-columns:170px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.inj-row.late .inj-nome button{color:var(--late)}
.inj-nome{display:grid;min-width:0} .inj-nome small{color:var(--soft);font-size:.78rem}
.inj-nome button{font-weight:700;text-align:left;background:none;border:0;padding:0;font-size:.95rem;color:var(--ink)}
.inj-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){.inj-row{grid-template-columns:1fr}.inj-acts{justify-content:flex-start}}
.trilha-t.sm{font-size:.8rem;margin-top:10px}
.dias{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 16px}
@media(min-width:760px){.dias{grid-template-columns:repeat(5,minmax(0,1fr))}}
.dia{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:3px;text-align:left;align-content:start;color:var(--ink)}
.dia.sel{border:2px solid var(--accent);background:#eef4fc}
.dia b{font-size:.95rem;text-transform:capitalize}
.dia span{font-size:.82rem;font-weight:700;color:var(--deep)} .dia span small{font-weight:600;color:var(--soft)}
.tk-local{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tk-local h3{font-size:1.05rem;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.tk-g{margin-top:10px} .tk-gt{font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0}
.tk-gt small{font-weight:600;color:var(--soft);font-size:.76rem}
.tk-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tk-row.atrasada .inj-nome button{color:var(--late)}
.tk-txt{color:var(--deep)!important;font-weight:600}
@media(max-width:700px){.tk-row{grid-template-columns:1fr}}
.fchip{border:1px solid transparent;cursor:pointer;font-family:inherit}
.fchip.on{border-color:currentColor;box-shadow:0 0 0 2px currentColor inset}
.fl:not(.late):not(.warn):not(.ok):not(.blue){background:#eceff3;color:var(--soft)}
.fl.blue{background:#e3edf9;color:var(--accent)}
.pos-st{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pos-box{border-left-color:var(--sage);margin-top:14px}
.sheet select,.form select{width:100%}
.acao-box{background:#fff5f2;border:1px solid #f1c7bc;border-left:5px solid var(--late);border-radius:16px;padding:14px;display:grid;gap:8px;margin:4px 0 14px}
.acao-box h3{color:var(--late);display:flex;gap:8px;align-items:center}
.acao-box.ok{background:var(--ok-soft);border-color:#bfe0cc;border-left-color:var(--ok);color:var(--ok);font-size:.9rem}
.loc-sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:.9rem;color:var(--deep);margin:4px 0 14px}
.loc-sel select{width:auto;min-width:240px;font:inherit;font-size:1rem;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;padding:4px 0;cursor:pointer}
.ck input{margin-top:3px;width:18px;height:18px;flex:none}
.ck.opc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.ck small{color:var(--soft)}
.tp-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.tp-row label{font-size:.72rem;color:var(--soft);display:grid;gap:2px}
.tp-row input{padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;width:100%}
@media(max-width:600px){.tp-row{grid-template-columns:1fr 1fr 1fr}.tp-row>div{grid-column:1/-1}}
.kpis.rep{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kpi.warn{border-left-color:var(--warn)} .kpi.warn b{color:var(--warn)}
.insight ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.92rem}
.panel.alerta{border-left:5px solid var(--warn)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.grid3 label{display:grid;gap:4px;font-size:.82rem;font-weight:700;color:var(--soft)}
.grid3 input,.grid3 select{padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.tbl.conf td{font-size:.84rem} .tbl.conf tr.ok td{background:#f1f8f4} .tbl.conf tr.al td{background:var(--late-soft)}
.tbl.conf input[type=checkbox]{width:18px;height:18px}
.tbl tr.best td{background:var(--ok-soft)}
.fn.rp{grid-template-columns:150px 1fr 90px;cursor:default} .fn.rp small{display:block;font-weight:600;font-size:.72rem;color:var(--soft)}
.rep-card .name b{font-size:1rem}
.grid-panels .panel{align-content:start}
.fn.rp{cursor:pointer;background:none;border:0;width:100%;text-align:left;font:inherit;color:inherit;border-radius:10px;padding:4px 6px}
.fn.rp:hover{background:#eef4fc}
button.kpi{font:inherit;color:inherit;cursor:pointer} button.kpi:hover{box-shadow:0 0 0 2px var(--accent) inset}
.tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#eef4fc}
.rp-pac{border-top:1px solid var(--line);padding:8px 0}
.rp-pac summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;list-style:none}
.rp-pac summary small{display:block;color:var(--soft);font-size:.78rem}
.tbl.pdia tfoot td{text-transform:none;letter-spacing:0;font-size:inherit;color:inherit;background:#f3f7fc;border-top:2px solid var(--line)} .tbl.pdia td small{display:block;color:var(--soft);font-size:.72rem} .tbl.pdia td.clk{cursor:pointer} .tbl.pdia td.clk:hover{background:#eef4fc} .tbl.pdia td.vazio{color:#c3cbd6}
.loc-sel input[type=date]{padding:9px 10px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--surface)}
.rep-bar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:4px 0 16px;display:grid;gap:12px}
.rb-row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
@media(max-width:700px){.rb-row{grid-template-columns:1fr;gap:6px}}
.rb-lab{font-weight:600;color:var(--brand,#1d4f91);font-size:.9rem}
.rb-sel{max-width:320px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.rb-chips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:.88rem;cursor:pointer;color:inherit}
.rchip[aria-pressed="true"]{background:#1d4f91;border-color:#1d4f91;color:#fff;font-weight:600}
.rchip.sem{color:#a0a8b4;border-style:dashed} .rchip.grp{background:#fdf6ea;border-color:#efd3a3} .rchip.grp[aria-pressed="true"]{background:#e8a33d;border-color:#e8a33d} .rb-sep{font-size:.8rem;color:var(--soft);align-self:center;margin-left:6px} .tbl tr.soma td{background:#f3f7fc;border-top:2px solid var(--line)}
.rb-datas{display:flex;gap:10px;flex-wrap:wrap}.rb-datas label{display:flex;gap:6px;align-items:center;font-size:.88rem;color:var(--soft)}
.rb-datas input{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.rb-of{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.of-loc{display:flex;align-items:center;gap:8px;font-size:.88rem}.of-loc>span{font-weight:600}
.of-dias{display:flex;gap:3px}.of-d{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:.78rem;cursor:pointer;color:var(--soft)}
.of-d[aria-pressed="true"]{background:#e8a33d;border-color:#e8a33d;color:#fff;font-weight:700}
.of-chk input{width:auto!important;margin:0;flex:none} .of-chk{flex-basis:100%;justify-content:flex-start;text-align:left;display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--soft)}
.rb-cobre{font-size:.8rem;color:var(--soft);border-top:1px dashed var(--line);padding-top:10px}.rb-cobre span{display:inline-block;background:#f1f4f8;border-radius:6px;padding:2px 8px;margin:0 6px 4px 6px}.rb-cobre em{font-style:normal}
.tbl.pdia td.of{box-shadow:inset 3px 0 0 #e8a33d}.tbl.pdia td.fora{background:repeating-linear-gradient(135deg,#fafafa 0 6px,#f1f1f1 6px 12px);color:#8a94a3}.tbl.pdia td.fora b{color:#6b7480}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px}.lg.of{background:#e8a33d}.lg.fora{background:#ddd}
button.kpi.fora{border-left-color:#bbb;background:#fafafa}
details.conf{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff} details.conf summary{cursor:pointer;padding:10px 14px;list-style:none} details.conf summary::-webkit-details-marker{display:none}
details.conf.sem summary b,details.conf.zero summary b{color:#b4472f} details.conf .tbl td small{display:block;color:var(--soft)} details.conf .tbl td small.ok{color:#2f7d4f}
.conf-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:6px 0 10px} .conf-kpis .kpi.alerta b{color:#b4472f}
.ag-dia{margin-top:12px} .ag-l{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)} .ag-l.apagado{opacity:.5}
.ag-h{font-variant-numeric:tabular-nums;color:var(--soft);font-size:.85rem} .ag-p small{display:block;color:var(--soft);font-size:.78rem} .ag-p .ag-proc{color:#7a8494}
.ag-st{font-size:.76rem;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;background:#eef1f5;color:#5b6573} .ag-st.ok{background:#e4f4ea;color:#2f7d4f} .ag-st.outra{background:#e7effa;color:#1d4f91} .ag-st.zero{background:#fdf0dc;color:#a8650f} .ag-st.sem{background:#fbe5e1;color:#b4472f} .ag-st.cir{background:#f1e8fb;color:#6c3fa0}
.ag-leg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px} .ag-sem{align-self:center;font-weight:600;padding:0 6px}
@media(max-width:600px){ .ag-l{grid-template-columns:44px 1fr} .ag-st{grid-column:2;justify-self:start} }
/* Painel por fases */
.trilha-t{font-weight:700;font-size:.9rem;color:var(--soft);margin:14px 0 8px}
.fases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:760px){.fases{grid-template-columns:repeat(5,minmax(0,1fr))}}
.fase{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:2px;text-align:left;align-content:start}
.fase.sel{border:2px solid var(--accent);background:#eef4fc}
.fase b{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1}
.fase .fn1{font-weight:700;font-size:.9rem}
.fase .fn2{font-size:.76rem;color:var(--soft)}
.fl{display:inline-block;font-style:normal;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:4px;justify-self:start}
.fl.late{background:var(--late-soft);color:var(--late)} .fl.warn{background:var(--warn-soft);color:var(--warn)} .fl.ok{background:var(--ok-soft);color:var(--ok)}

/* Painel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}

.grip:active{cursor:grabbing}
.card-cir.dragging{opacity:.35}
.ghost-card{position:fixed;z-index:100;pointer-events:none;transform:rotate(2deg);box-shadow:0 22px 40px -16px rgba(24,41,74,.55);opacity:.95}
.move-list{display:grid;gap:8px}
.move-list .btn[disabled]{opacity:1;cursor:default}
/* Modal */
.sheet-bg{position:fixed;inset:0;background:rgba(15,24,40,.45);z-index:50;display:grid;align-items:end;justify-items:center}
@media(min-width:760px){.sheet-bg{align-items:center}}
.sheet{background:var(--surface);width:min(100%,640px);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px}
@media(min-width:760px){.sheet{border-radius:22px}}
.sheet header{display:flex;justify-content:space-between;align-items:start;gap:10px}
.sheet header h2{font-size:1.35rem}
.close{background:#f0ece5;border:0;border-radius:50%;width:36px;height:36px;font-size:1.2rem;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.sesslist{display:grid;gap:6px}
.sess{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;border-bottom:1px dashed var(--line);padding-bottom:6px}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:11;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;padding:14px 18px;box-shadow:0 14px 30px -12px rgba(24,41,74,.6)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60}

.tabs{grid-template-columns:repeat(6,1fr)}

@media(min-width:900px){.tabs{grid-template-columns:repeat(6,max-content)}.tabs button{font-size:.9rem}}

button.chip{border:0;cursor:pointer;font:inherit;font-size:.74rem;font-weight:700}

</style>

<script>
/* ================= Configuração ================= */
const SUPABASE_URL = "https://avbmtrvxieetoptmzere.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ohqe8a6rhGEwOImU302jjw_69V8kcJ7"; // chave pública; o acesso é protegido por RLS
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

const LOCAIS = ["OA Palmas","OA Paraíso","ICOG Palmas","ICOG Porto","OPUS"];
const CONVENIOS = ["SERVIR","CASSI","CAIXA"];          // + "Outros" (texto livre)
const TIPO_LABEL = {cirurgia:"Cirurgia",injecao:"Injeção",laser:"Laser"};
const INTERESSE = {baixo:["Baixo","int-b"],medio:["Médio","int-m"],alto:["Alto","int-a"],fechado:["Fechado","int-f"]};

// Quadro de INDICAÇÕES (comercial). prazo = dias "saudáveis" na coluna antes do alerta
const ETAPAS_IND = [
  ["indicado","Nova indicação","Enviar orçamento (particular) ou guia/pedido (convênio)",3],
  ["orcamento","Orçamento / guia enviado","Esperando o paciente ou o convênio responder",7],
  ["aguardando","Aguardando resposta","Particular: decidindo · Convênio: em autorização",15],
  ["fechado","Fechado","Cirurgia: falta agendar",7],
];
// Quadro de EXECUÇÃO das cirurgias (depois de fechado)
const ETAPAS_EXE = [
  ["fechado","Fechado · a agendar","Marcar data no centro cirúrgico",7],
  ["agendado","Agendado","Data marcada",null],
  ["realizado","Realizado","Cirurgia feita",3],
  ["pos_op","Pós-operatório","Retornos 1, 7 e 30 dias",45],
  ["finalizado","Alta","Acompanhamento concluído",null],
];
const ETAPA_LABEL = {indicado:"Nova indicação",orcamento:"Orçamento/guia enviado",aguardando:"Aguardando resposta",fechado:"Fechado",agendado:"Agendado",realizado:"Realizado",pos_op:"Pós-operatório",finalizado:"Alta",em_tratamento:"Em tratamento",desistiu:"Perdido / não fará"};
const ABERTAS = ["indicado","orcamento","aguardando"];
// Prazo para considerar convênio "travado" (dias desde o envio da guia sem fechar)
const PRAZO_CONVENIO = 15, PRAZO_PARTICULAR = 3;
// Injeções/laser: lembrete D+20, vencimento D+30
const LEMBRAR_DIAS = 14, VENCE_DIAS = 30, PAUSA_DIAS = 60;

const S = { tab:"painel", pacientes:[], casos:[], sessoes:[], pos:[], modelos:[], precos:[], orcs:[], reps:[], repItens:[], repSel:null, repLocs:(()=>{try{return JSON.parse(localStorage.getItem("repLocs")||"[]")}catch(e){return []}})(), repMes:"", repDe:"", repAte:"", repFiltro:"todos", repBusca:"", user:null, fInd:"todos", fTrat:"ativos", busca:"" };

/* ================= Utilidades ================= */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoje = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => d ? new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10) : null;
const parse = s => s ? new Date(String(s).slice(0,10)+"T00:00:00") : null;
const addDias = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const diff = (a,b) => Math.round((a-b)/86400000);
const desde = s => s ? diff(hoje(), parse(s)) : null;
const br = s => { if(!s) return "—"; const [y,m,d]=String(s).slice(0,10).split("-"); return `${d}/${m}/${y.slice(2)}`; };
const dm = s => s ? br(s).slice(0,5) : "—";
const plural = (n,s,p) => `${n} ${n===1?s:p}`;
const nomeCurto = n => { const p=String(n||"").toLowerCase().split(/\s+/).filter(Boolean).map(w=>w.length>2?w[0].toUpperCase()+w.slice(1):w); return p.length>3?[p[0],p[1],p[p.length-1]].join(" "):p.join(" "); };
const moeda = v => v==null||v==="" ? "" : Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
function fones(tel){ return String(tel||"").split(/[|/]/).map(s=>s.replace(/\D/g,"")).filter(s=>s.length>=10); }
function contato(tel){
  const f=fones(tel)[0]; if(!f) return '<span class="meta">sem telefone</span>';
  const intl = f.startsWith("55")?f:"55"+f;
  return `<span class="contact"><a href="tel:+${intl}">Ligar</a><a class="wa" href="https://wa.me/${intl}" target="_blank" rel="noopener">WhatsApp</a></span>`;
}
const pacOf = c => S.pacientes.find(p=>p.id===c.paciente_id) || {nome:"?"};
const pagLabel = c => c.pagamento==="particular" ? "Particular" : (c.convenio || "Convênio");
const ehConv = c => c.pagamento==="convenio";
function chipPag(c){ return `<span class="chip ${ehConv(c)?"conv":"part"}">${esc(pagLabel(c))}</span>`; }
function chipInt(c){ const i=INTERESSE[c.interesse||"medio"]; return `<button class="chip ${i[1]}" data-int="${c.id}" title="Toque para mudar o interesse">● ${i[0]}</button>`; }

/* ================= Regras ================= */
// Situação de uma indicação aberta: o que precisa ser feito e se está atrasada
function situacaoInd(c){
  const dEt = desde(c.etapa_desde), dInd = desde(c.data_indicacao || c.criado_em);
  const dEnv = desde(c.orcamento_em);
  if (c.etapa==="indicado" && dEt!==null && dEt>3) return {nivel:"warn", txt:`Há ${plural(dEt,"dia","dias")} sem ${ehConv(c)?"enviar a guia":"enviar orçamento"}`};
  if (["orcamento","aguardando"].includes(c.etapa) && ehConv(c) && dEnv!==null && dEnv>PRAZO_CONVENIO)
    return {nivel:"late", txt:`Convênio parado há ${dEnv} dias · conferir documentos/autorização`};
  if (["orcamento","aguardando"].includes(c.etapa) && !ehConv(c) && dEnv!==null && dEnv>PRAZO_PARTICULAR)
    return {nivel:"warn", txt:`Orçamento sem resposta há ${dEnv} dias · fazer contato`};
  if (c.etapa==="fechado" && c.tipo==="cirurgia" && dEt!==null && dEt>7) return {nivel:"warn", txt:`Fechado há ${dEt} dias e ainda sem data`};
  return {nivel:"", txt: dInd!==null ? `Indicado há ${plural(dInd,"dia","dias")}` : ""};
}

// Injeção/laser: aplicações do ciclo atual, D+20 (lembrar) e D+30 (vence)
function statusTrat(c){
  const ses = S.sessoes.filter(s=>s.caso_id===c.id);
  const ciclo = ses.length ? Math.max(...ses.map(s=>s.ciclo)) : 1;
  const doCiclo = ses.filter(s=>s.ciclo===ciclo).sort((a,b)=>a.numero-b.numero);
  const feitas = doCiclo.filter(s=>s.data_realizada);
  const total = c.total_sessoes || 3;
  const ultima = feitas.length ? feitas.map(s=>s.data_realizada).sort().at(-1) : null;
  const agendada = doCiclo.find(s=>!s.data_realizada && s.data_prevista);
  const dU = ultima ? desde(ultima) : null;
  const lembrar = ultima ? addDias(parse(ultima), LEMBRAR_DIAS) : null;
  const vence = ultima ? addDias(parse(ultima), c.intervalo_dias || VENCE_DIAS) : null;
  let estado="ok", rotulo="";
  if (["finalizado","desistiu"].includes(c.etapa)) { estado="fim"; rotulo=ETAPA_LABEL[c.etapa]; }
  else if (feitas.length >= total) { estado="avaliar"; rotulo=`Ciclo completo (${total}/${total}) · avaliar novo ciclo`; }
  else if (agendada) { estado="agendado"; rotulo=`${feitas.length+1}ª aplicação agendada · ${br(agendada.data_prevista)}`; }
  else if (!ultima) { estado="primeira"; rotulo="1ª aplicação a agendar"; }
  else if (dU >= PAUSA_DIAS) { estado="pausa"; rotulo=`Em pausa · ${dU} dias sem aplicação`; }
  else if (dU >= (c.intervalo_dias||VENCE_DIAS)) { estado="late"; rotulo=`D+${dU} · venceu em ${dm(iso(vence))}`; }
  else if (dU >= LEMBRAR_DIAS) { estado="lembrar"; rotulo=`D+${dU} · agendar próxima (vence ${dm(iso(vence))})`; }
  else { estado="ok"; rotulo=`D+${dU} · lembrete em ${dm(iso(lembrar))}`; }
  const avisado = c.ultimo_contato && ultima && c.ultimo_contato >= ultima && ["late","lembrar"].includes(estado);
  return { ses, ciclo, doCiclo, feitas, total, ultima, agendada, dU, lembrar, vence, estado, rotulo, avisado };
}

/* ================= Dados ================= */
async function carregar(){
  const [p,c,s] = await Promise.all([
    sb.from("pacientes").select("*").order("nome"),
    sb.from("casos").select("*").order("criado_em"),
    sb.from("sessoes").select("*").order("numero"),
  ]);
  const [ps,md,tp,oc] = await Promise.all([sb.from("pos_contatos").select("*"), sb.from("modelos").select("*").order("tipo").order("nome"), sb.from("tabela_precos").select("*").order("ordem"), sb.from("orcamentos").select("*")]);
  S.pos=ps.data||[]; S.modelos=md.data||[]; S.precos=tp.data||[]; S.orcs=oc.data||[];
  const rp=await sb.from("repasses").select("*").order("periodo_fim",{ascending:false}); S.reps=rp.data||[];
  let ri=[]; for(let k=0;k<50;k++){ const r=await sb.from("repasse_itens").select("*").range(k*1000,k*1000+999); if(r.error||!r.data) break; ri=ri.concat(r.data); if(r.data.length<1000) break; } S.repItens=ri;
  let at=[]; for(let k=0;k<50;k++){ const r=await sb.from("atendimentos").select("id,data,local,unidade,paciente,plano,itens,tipo,status,descricao").range(k*1000,k*1000+999); if(r.error||!r.data) break; at=at.concat(r.data); if(r.data.length<1000) break; } S.atend=at;
  const sc=await sb.from("sincronizacoes").select("*").order("em",{ascending:false}).limit(1); S.ultSync=(sc.data||[])[0]||null;
  const err = p.error||c.error||s.error; if (err) { toast("Erro ao carregar: "+err.message); return; }

function diasSemana(){

function tarefasSemana(){
  const h=hoje(), dias=diasSemana(), fim=dias[4];
  const out=[], pausa=[], antigas=[];
  for(const c of S.casos){
    if(["finalizado","desistiu"].includes(c.etapa)) continue;
    if(ABERTAS.includes(c.etapa)){
      const si=situacaoInd(c); const ctt=c.ultimo_contato&&desde(c.ultimo_contato)<7;
      const idade=desde(c.etapa_desde||c.data_indicacao||c.criado_em)??0;
      if(idade>PAUSA_DIAS) antigas.push({c,g:"antiga",txt:`${ETAPA_LABEL[c.etapa]} há ${idade} dias${c.local?" · "+c.local:""}`});
      else if(si.nivel && !ctt) out.push({c,g:"cobrar",txt:si.txt,nivel:si.nivel});
      continue;
    }
    if(c.tipo==="cirurgia"){
      if(c.etapa==="fechado") out.push({c,g:"ciragendar",txt:`Fechado há ${desde(c.etapa_desde)??"?"} dias`});
      if(c.etapa==="agendado"&&c.data_agendada){ const dt=parse(c.data_agendada); if(dt>=h&&dt<=fim) out.push({c,g:"cirdia",data:dt,txt:`Cirurgia ${br(c.data_agendada)}`}); }
      continue;
    }
    const st=statusTrat(c), prox=`${Math.min(st.feitas.length+1,st.total)}ª de ${st.total}`;
    if(st.estado==="pausa"){ pausa.push({c,st}); continue; }
    if(st.estado==="agendado"){ const dt=parse(st.agendada.data_prevista);
      if(dt<h) out.push({c,g:"atrasada",txt:`Estava marcada para ${br(st.agendada.data_prevista)} · ${prox}`,st});
      else if(dt<=fim) out.push({c,g:"aplicar",data:dt,txt:`${prox} · marcada ${dm(st.agendada.data_prevista)}`,st});
      continue; }
    if(st.estado==="late") out.push({c,g:"atrasada",txt:`${st.dU} dias da última (${dm(st.ultima)}) · ${prox}`,st});
    else if(st.estado==="lembrar"&&!st.avisado) out.push({c,g:"agendar",txt:`Última ${dm(st.ultima)} · fazer até ${dm(iso(st.vence))} · ${prox}`,st});
    else if(st.estado==="primeira") out.push({c,g:"primeira",txt:`Fechado ${c.fechado_em?br(c.fechado_em):""}`,st});
    else if(st.estado==="avaliar") out.push({c,g:"reavaliar",txt:`Ciclo ${st.ciclo} completo · última ${dm(st.ultima)}`,st});
  }
  const porDia=dias.map(()=>[]), semLocal=[];
  for(const t of out){
    let i=-1;
    if(t.data) i=dias.findIndex(d=>diff(d,t.data)===0);
    else if(t.c.local) i=dias.findIndex(d=>(AGENDA[d.getDay()]||[]).some(([l])=>l===t.c.local));
    if(i<0){ if(!t.c.local) semLocal.push(t); else if(t.data) {} else semLocal.push(t); continue; }
    porDia[i].push(t);
  }
  return {dias,porDia,semLocal,pausa,antigas};
}

function acaoImediata(){
  const out=[];
  for(const c of S.casos){
    if(!noLocal(c) || !ehConv(c) || ["finalizado","desistiu"].includes(c.etapa)) continue;
    if(ABERTAS.includes(c.etapa)){
      const idade=desde(c.etapa_desde||c.data_indicacao||c.criado_em)??0, si=situacaoInd(c);
      if(idade<=PAUSA_DIAS && si.nivel && !(c.ultimo_contato&&desde(c.ultimo_contato)<7)) out.push({c,g:"cobrar",txt:si.txt,peso:si.nivel==="late"?2:1});
      continue;
    }
    if(c.tipo==="cirurgia"){ if(c.etapa==="fechado"&&(desde(c.etapa_desde)??0)>7) out.push({c,g:"ciragendar",txt:`Convênio liberado/fechado há ${desde(c.etapa_desde)} dias e sem data`,peso:2}); continue; }
    const st=statusTrat(c), prox=`${Math.min(st.feitas.length+1,st.total)}ª de ${st.total}`;
    if(st.estado==="late") out.push({c,g:"atrasada",txt:`Vencida · ${st.dU} dias da última (${dm(st.ultima)}) · ${prox}`,peso:3,st});
    else if(st.estado==="agendado"&&parse(st.agendada.data_prevista)<hoje()) out.push({c,g:"atrasada",txt:`Estava marcada para ${br(st.agendada.data_prevista)} e não foi registrada · ${prox}`,peso:3,st});
    else if(st.estado==="primeira"&&(desde(c.etapa_desde)??0)>7) out.push({c,g:"primeira",txt:`Fechado há ${desde(c.etapa_desde)} dias e a 1ª ainda não foi agendada`,peso:2,st});
  }
  return out.sort((a,b)=>b.peso-a.peso);
}

/* ===== Pós-procedimento: contato e WhatsApp ===== */
const POS_DIAS = 15;
function procsRecentes(){
  const ini=addDias(hoje(),-POS_DIAS), out=[];
  for(const c of S.casos){
    if(!noLocal(c)) continue;
    if(c.tipo==="cirurgia" && c.data_realizado && ["realizado","pos_op","finalizado"].includes(c.etapa) && parse(c.data_realizado)>=ini)
      out.push({c,ses:null,data:c.data_realizado,rot:`Cirurgia ${c.procedimento||""}`.trim()});
  }
  for(const s of S.sessoes){
    if(!s.data_realizada || parse(s.data_realizada)<ini) continue;
    const c=S.casos.find(x=>x.id===s.caso_id); if(!c||!noLocal(c)) continue;
    out.push({c,ses:s,data:s.data_realizada,rot:`${TIPO_LABEL[c.tipo]}${c.olho?" "+c.olho:""} · ${s.numero}ª aplicação`});
  }
  for(const x of out) x.pos=S.pos.find(p=>p.caso_id===x.c.id && (p.sessao_id||null)===(x.ses?x.ses.id:null))||null;
  return out.sort((a,b)=>b.data.localeCompare(a.data));
}
function blocoPos(){
  const L=procsRecentes();
  const semCont=L.filter(x=>!x.pos?.contato_em), semWa=L.filter(x=>!x.pos?.whatsapp_em), ok=L.filter(x=>x.pos?.contato_em&&x.pos?.whatsapp_em);
  const f=S.fPos||"pend";
  const vis = f==="contato"?semCont : f==="whats"?semWa : f==="ok"?ok : L.filter(x=>!(x.pos?.contato_em&&x.pos?.whatsapp_em));
  const chip=(k,cls,n,t)=>`<button class="fl ${cls} fchip ${f===k?"on":""}" data-fpos="${k}">${n} ${t}</button>`;
  const nomeMod=id=>{ const m=S.modelos.find(x=>x.id===id); return m?esc(m.nome):""; };
  const linhas=vis.map(x=>{ const c=x.c,p=pacOf(c),key=`${c.id}|${x.ses?x.ses.id:""}`;
    const sc=x.pos?.contato_em?`<span class="fl ok">✔ Contato ${dm(x.pos.contato_em)}</span>`:`<span class="fl warn">Contato pendente</span>`;
    const sw=x.pos?.whatsapp_em?`<span class="fl ok">✔ WhatsApp ${dm(x.pos.whatsapp_em)}${x.pos.modelo_msg?" · "+nomeMod(x.pos.modelo_msg):""}${x.pos.modelo_video?" · 🎬 "+nomeMod(x.pos.modelo_video):""}</span>`:`<span class="fl warn">WhatsApp pendente</span>`;
    return `<div class="tk-row"><div class="inj-nome"><button class="linklike" data-pac="${p.id}">${esc(nomeCurto(p.nome))}</button><small>${esc(x.rot)} · ${br(x.data)}${c.local?" · "+esc(c.local):""}</small><div class="pos-st">${sc}${sw}</div></div>
    <div class="inj-acts">${x.pos?.contato_em?"":`<button class="btn small ghost" data-act="pos-contato" data-key="${key}">Contato feito</button>`}<button class="btn small ${x.pos?.whatsapp_em?"ghost":"okb"}" data-act="pos-whats" data-key="${key}">${x.pos?.whatsapp_em?"Reenviar":"Enviar WhatsApp"}</button></div></div>`; }).join("");
  return `<div class="inj-box pos-box">

/* Leitura de repasses. Usado no portal (navegador) e testado no Node.
   Formatos: (1) extrato PDF do EyecareBI, (2) planilha de repasse (Data, Paciente, Convênio, Procedimentos, Valor, Repasse). */
const REP = (() => {
  const num = s => { if (s == null) return null; if (typeof s === "number") return s; s = String(s).replace(/R\$|\s|…|\.\.\./g, ""); if (!s) return null;
    if (/,/.test(s)) s = s.replace(/\./g, "").replace(",", "."); const v = parseFloat(s); return isNaN(v) ? null : v; };
  const dataISO = s => { const m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; };
  const limpa = s => String(s || "").replace(/\s+/g, " ").replace(/\s*…$/, "…").trim();

  function categoria(proc) {
    const p = String(proc || "").toUpperCase();
    if (/RETORNO/.test(p) && !/CONSULTA/.test(p)) return "retorno";
    if (/FACECTOMIA|FACO|VITRECTOMIA|VVPP|IMPLANTE DE LENTE|PTERIG|TRABECULEC|CIRURGIA|IMPLANTE SECUND/.test(p)) return "cirurgia";
    if (/LUCENTIS|AVASTIN|EYLIA|VABYSMO|INTRAV|ANTI-?ANGIO|QUIMIOTER|PCT-HM|TRATAMENTO OCULAR/.test(p)) return "injecao";
    if (/FOTOCOAG|YAG|CAPSULOTOMIA|LASER|IRIDOTOMIA/.test(p)) return "laser";
    if (/CONSULTA/.test(p)) return "consulta";
    return "exame";
  }

  /* ---------- PDF EyecareBI ----------
     pages: [{items:[{str,x,y}]}] (y cresce para cima, como no pdf.js) */
  function pdfEyecare(pages) {
    const out = { formato: "EyecareBI", numero: null, periodo_ini: null, periodo_fim: null, total_informado: null, subtotais: {}, itens: [] };
    let secao = null;
    for (const pg of pages) {
      // agrupa em linhas
      const its = pg.items.filter(i => i.str && i.str.trim()).sort((a, b) => b.y - a.y || a.x - b.x);
      const linhas = [];
      for (const it of its) { const l = linhas.find(L => Math.abs(L.y - it.y) < 2.2); if (l) l.its.push(it); else linhas.push({ y: it.y, its: [it] }); }
      linhas.forEach(l => l.its.sort((a, b) => a.x - b.x));
      // colunas a partir do cabeçalho da página
      let col = null;
      for (const l of linhas) {
        const t = l.its.map(i => i.str).join(" ");
        const ach = re => (l.its.find(i => re.test(i.str)) || {}).x;
        if (/Data aten/.test(t) && /Paciente/.test(t)) {
          col = { proc: ach(/Proced/), pac: ach(/^Paciente/), perfil: ach(/^Perfil/), conv: ach(/^Convênio/), met: ach(/^Mét/) };
        }
      }
      for (const l of linhas) {
        const t = l.its.map(i => i.str).join(" ").replace(/\s+/g, " ").trim();
        let m;
        if (!out.numero && (m = t.match(/Nº\s*(\d+)/))) out.numero = m[1];
        if (!out.periodo_ini && (m = t.match(/(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{2}\/\d{2}\/\d{4})/))) { out.periodo_ini = dataISO(m[1]); out.periodo_fim = dataISO(m[2]); }
        if ((m = t.match(/Valor total de repasse\s*R\$\s*([\d.,]+)/))) { out.total_informado = num(m[1]); continue; }
        if ((m = t.match(/^Subtotal (.+?)\s+R\$\s*([\d.,]+)/))) { out.subtotais[m[1].trim()] = num(m[2]); continue; }
        if (/^\d{2}\/\d{2}\/\d{4}/.test(t) && col) {
          const c = { proc: [], pac: [], perfil: [], conv: [], met: [], resto: [] };
          for (const it of l.its) {
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(it.str.trim())) continue;
            const x = it.x;
            if (x < col.pac - 1) c.proc.push(it.str);
            else if (x < col.perfil - 1) c.pac.push(it.str);
            else if (x < col.conv - 1) c.perfil.push(it.str);
            else if (x < col.met - 1) c.conv.push(it.str);
            else c.resto.push(it.str);
          }
          const resto = c.resto.join(" ");
          const vm = resto.match(/R\$\s*([\d.]+,\d{1,2})/);
          const met = resto.replace(/R\$.*$/, "").replace(/\s+-\s*$/, "").trim();
          const parc = (met.match(/(\d+\/\d+x)\s*$/) || [])[1] || null;
          const pag = met.replace(/\s*\d+\/\d+x\s*$/, "").replace(/^-\s*/, "").trim();
          out.itens.push({
            data: dataISO(t), procedimento: limpa(c.proc.join(" ")), paciente: limpa(c.pac.join(" ")),
            convenio: secao || limpa(c.conv.join(" ")), valor: vm ? num(vm[1]) : 0,
            pagamento: pag && pag !== "-" ? pag + (parc ? " " + parc : "") : null,
          });
          continue;
        }
        // título de seção (nome do convênio em linha própria)
        if (/^[A-ZÀ-Ú][A-ZÀ-Ú0-9 .\-\/]{1,40}$/.test(t) && !/^Itens|^Data|^Subtotal|^Sistema|^FAVORECIDO/.test(t) && !/R\$/.test(t)) secao = t.replace(/\s+/g, " ");
      }
    }
    out.itens.forEach(i => { i.categoria = categoria(i.procedimento); i.qtd = 1; });
    return out;
  }

  /* ---------- Planilha (linhas = arrays) ---------- */
  function planilha(rows) {
    const out = { formato: "Planilha", numero: null, periodo_ini: null, periodo_fim: null, total_informado: null, subtotais: {}, itens: [] };
    const h = rows.findIndex(r => r && r.some(c => /^paciente$/i.test(String(c || "").trim())));
    if (h < 0) throw new Error("Não achei a coluna 'Paciente' na planilha.");
    const cab = rows[h].map(c => String(c || "").trim().toLowerCase());
    const ci = re => cab.findIndex(c => re.test(c));
    const cD = ci(/^data/), cP = ci(/^paciente/), cC = ci(/conv/), cPr = ci(/proced/), cV = ci(/^valor/);
    let cR = ci(/repasse/); if (cR < 0) cR = cV + 1;
    for (const r of rows.slice(h + 1)) {
      if (!r || !r[cP]) { if (r && r[cV] != null && !r[cP]) out.total_informado = num(r[cR]) ?? out.total_informado; continue; }
      const d = r[cD]; let data = null;
      if (d instanceof Date) data = d.toISOString().slice(0, 10);
      else if (typeof d === "number") data = new Date(Math.round((d - 25569) * 864e5)).toISOString().slice(0, 10);
      else data = dataISO(d);
      const proc = limpa(r[cPr]), procs = proc.split(/\s*,\s*/).filter(Boolean);
      const conv = limpa(String(r[cC] || "").split(",")[0]);
      const bruto = num(r[cV]), rep = num(r[cR]);
      const cats = procs.map(categoria);
      const cat = cats.includes("cirurgia") ? "cirurgia" : cats.includes("injecao") ? "injecao" : cats.includes("laser") ? "laser" : cats.includes("consulta") ? "consulta" : cats.every(c => c === "retorno") ? "retorno" : "exame";
      out.itens.push({ data, paciente: limpa(r[cP]), convenio: conv, procedimento: proc, categoria: cat, qtd: cat === "exame" ? procs.length : 1,
        valor_bruto: bruto, valor: rep != null ? rep : 0, pagamento: null });
    }
    const ds = out.itens.map(i => i.data).filter(Boolean).sort();
    out.periodo_ini = ds[0] || null; out.periodo_fim = ds[ds.length - 1] || null;
    return out;
  }
  return { pdfEyecare, planilha, categoria, num };
})();


/* ===================== PLANILHAS DO DRIVE (sincronização) ===================== */
// Lê as planilhas "OFT. AV. / ICOG / OPUS - CIR./INJ./LASER" e acrescenta no portal só o que é novo:
// pacientes e casos novos, sessões novas de injeção/laser e cirurgias que passaram a ter data. Nunca apaga nem sobrescreve.
const PL={
  s(v){ if(v===null||v===undefined) return ""; if(typeof v==="number") v=String(Math.round(v)); return String(v).replace(/\s+/g," ").trim(); },
  d(v){ if(v instanceof Date&&!isNaN(v)) return v.getFullYear()>=2025?`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`:null;
        const m=PL.s(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(!m) return null; const y=m[3].length===2?2000+ +m[3]:+m[3]; return y>=2025?`${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:null; },

function statusRepasseAt(a,ctx){
  if(a.status!=="FINISHED") return {k:"nao",tx:a.status==="CANCELED"?"cancelado":"não finalizado"};
  if(!ctx.fim||a.data>ctx.fim||a.data<ctx.ini) return {k:"aguarda",tx:"aguardando extrato"};
  const hits=ctx.ext.filter(e=>e.paciente&&nomeBate(e.paciente,a.paciente));
  const md=hits.filter(e=>e.data===a.data); const perto=hits.filter(e=>e.data!==a.data&&Math.abs(parse(e.data)-parse(a.data))/864e5<=4);
  if(md.length){ const v=md.reduce((s,e)=>s+Number(e.valor||0),0); return v>0?{k:"ok",tx:moeda(v),v}:{k:"zero",tx:"R$ 0"}; }
  if(perto.length){ const v=perto.reduce((s,e)=>s+Number(e.valor||0),0); return {k:"outra",tx:`pago em ${perto.map(e=>br(e.data).slice(0,5)).join(", ")} · ${moeda(v)}`,v}; }
  if(/^retorno$/i.test((a.itens||"").trim())) return {k:"normal",tx:"retorno · sem cobrança"};
  if(/FACECTOMIA|VITRECTOMIA/i.test(a.itens||"")) return {k:"cir",tx:"cirurgia · confirmar GoCare"};
  return {k:"sem",tx:"sem repasse"};
}

function conferenciaProntuario(){
  const oa=S.reps.filter(r=>/^OA\b/.test(r.local)&&repLocOk(r.local)); if(!oa.length||!(S.atend||[]).length) return null;
  const ini0=oa.map(r=>r.periodo_ini||"0000").sort()[0], ini=(S.repDe&&S.repDe>ini0)?S.repDe:ini0, fim=[...oa.map(r=>r.periodo_fim||"9999")].sort().at(-1);
  const fimF=S.repAte&&S.repAte<fim?S.repAte:fim;
  const ids=new Set(oa.map(r=>r.id)); const ext=S.repItens.filter(i=>ids.has(i.repasse_id));
  const ag={}; S.atend.filter(a=>a.status==="FINISHED"&&a.data>=ini&&a.data<=fimF&&repLocOk(a.local)).forEach(a=>{ const k=a.data+"|"+normNome(a.paciente); (ag[k]=ag[k]||{data:a.data,paciente:a.paciente,local:a.local,planos:new Set(),itens:[]}); if(a.plano) ag[k].planos.add(a.plano); if(a.itens) ag[k].itens.push(a.itens); });
  const res={sem:[],zero:[],outra:[],normal:[],cir:[],total:0,ini,fim:fimF};
  const dif=(a,b)=>Math.abs(parse(a)-parse(b))/864e5;
  Object.values(ag).forEach(p=>{ res.total++; p.plano=[...p.planos].join(" / "); p.proc=p.itens.join(" | ");
    const hits=ext.filter(e=>e.paciente&&nomeBate(e.paciente,p.paciente)); const md=hits.filter(e=>e.data===p.data); const perto=hits.filter(e=>e.data!==p.data&&dif(e.data,p.data)<=4);
    if(md.length){ const v=md.reduce((s,e)=>s+Number(e.valor||0),0); if(v===0) res.zero.push(p); return; }
    if(perto.length){ p.pago=perto; res.outra.push(p); return; }
    if(/^retorno$/i.test(p.proc.trim())||(/retorno/i.test(p.proc)&&/particular/i.test(p.plano))) res.normal.push(p);
    else if(/FACECTOMIA|VITRECTOMIA/i.test(p.proc)) res.cir.push(p);
    else res.sem.push(p); });
  return res;
}
function painelConferencia(){

  const c=conferenciaProntuario();

   ${bloco("Atendidos sem repasse",c.sem,"sem",true)}${bloco("Repasse zerado (R$ 0)",c.zero,"zero",true)}${bloco("Cirurgias sem repasse da clínica (confirmar se foram pela GoCare)",c.cir,"cir",false)}${bloco("Pagos em outra data",c.outra,"outra",false)}${bloco("Retornos sem cobrança (normal)",c.normal,"normal",false)}

function repFiltrados(){

function metricasLocal(itens){
  const total=itens.reduce((s,i)=>s+Number(i.valor||0),0);
  const pac=new Set(itens.map(i=>normNome(i.paciente)).filter(Boolean));
  const so=S.repSoOf!==false, base=so?itens.filter(itOficial):itens, chave=i=>locItem(i)+"|"+i.data;
  const diasCons=new Set(base.filter(i=>["consulta","retorno"].includes(i.categoria)).map(chave));
  const dias=diasCons.size||new Set(base.map(chave)).size;
  const fora=itens.filter(i=>!itOficial(i)), foraV=fora.reduce((s,i)=>s+Number(i.valor||0),0), foraP=new Set(fora.map(i=>normNome(i.paciente))).size;
  const exames=itens.filter(i=>i.categoria==="exame").reduce((s,i)=>s+(i.qtd||1),0);
  const part=itens.filter(i=>/PARTIC/i.test(i.convenio||"")).reduce((s,i)=>s+Number(i.valor||0),0);
  const proc=itens.filter(i=>["cirurgia","injecao","laser"].includes(i.categoria)).reduce((s,i)=>s+Number(i.valor||0),0);
  const atend=new Set(base.filter(i=>i.paciente&&i.data).map(i=>normNome(i.paciente)+"|"+i.data)).size;
  return {total, fora:fora.length, foraV, foraP, pacientes:pac.size, atend, pacDia:dias?atend/dias:0, dias, porDia:dias?total/dias:0, porPac:pac.size?total/pac.size:0, exames, exPac:pac.size?exames/pac.size:0, pPart:total?part/total:0, pProc:total?proc/total:0};
}
function conferenciaRep(r){
  const it=S.repItens.filter(i=>i.repasse_id===r.id);
  const soma=it.reduce((s,i)=>s+Number(i.valor||0),0);
  const dif=r.total_informado!=null?soma-Number(r.total_informado):null;
  const zeros=it.filter(i=>Number(i.valor||0)===0&&["cirurgia","injecao","laser"].includes(i.categoria));
  // procedimentos do portal no mesmo local e período que não aparecem no repasse
  const ini=r.periodo_ini, fim=r.periodo_fim, falt=[];
  if(ini&&fim){
    const tem=(nome,data)=>it.some(i=>i.data===data&&mesmoPaciente(i.paciente,nome));
    S.casos.filter(c=>c.local===r.local&&c.tipo==="cirurgia"&&c.data_realizado&&c.data_realizado>=ini&&c.data_realizado<=fim).forEach(c=>{ const p=pacOf(c); if(!tem(p.nome,c.data_realizado)) falt.push({c,data:c.data_realizado,txt:`Cirurgia ${c.procedimento||""} ${c.olho||""}`}); });
    S.sessoes.filter(s=>s.data_realizada&&s.data_realizada>=ini&&s.data_realizada<=fim).forEach(s=>{ const c=S.casos.find(x=>x.id===s.caso_id); if(!c||c.local!==r.local) return; const p=pacOf(c); if(!tem(p.nome,s.data_realizada)) falt.push({c,data:s.data_realizada,txt:`${TIPO_LABEL[c.tipo]} ${c.olho||""} · ${s.numero}ª aplicação`}); });
  }
  const conf=it.filter(i=>i.conferido).length;
  return {it,soma,dif,zeros,falt,conf,ok:dif!=null&&Math.abs(dif)<0.05};
}

async function carregaLib(url,glob){ if(window[glob]) return window[glob]; await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=url; s.onload=res; s.onerror=()=>rej(new Error("Não consegui carregar o leitor de arquivos. Verifique a internet.")); document.head.appendChild(s); }); return window[glob]; }
async function lerArquivoRepasse(file){
  const buf=await file.arrayBuffer();
  if(/\.pdf$/i.test(file.name)){
    const lib=await carregaLib("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js","pdfjsLib");
    lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc=await lib.getDocument({data:new Uint8Array(buf)}).promise; const pages=[];
    for(let i=1;i<=doc.numPages;i++){ const p=await doc.getPage(i); const tc=await p.getTextContent(); pages.push({items:tc.items.map(t=>({str:t.str,x:t.transform[4],y:t.transform[5]}))}); }
    const r=REP.pdfEyecare(pages); if(!r.itens.length) throw new Error("Não encontrei itens neste PDF. Ele é um extrato de repasse do EyecareBI?"); return r;
  }
  const X=await carregaLib("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","XLSX");
  const wb=X.read(buf,{cellDates:true}); let last=null;
  for(const n of wb.SheetNames){ try{ const r=REP.planilha(X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true})); if(r.itens.length) return r; }catch(e){ last=e; } }
  throw last||new Error("Não encontrei itens na planilha.");
}
function folhaImportRepasse(){
  const guess=n=>/PARAISO|PARAÍSO/i.test(n)?"OA Paraíso":/PALMAS/i.test(n)?"OA Palmas":/ICOG/i.test(n)?(/PORTO/i.test(n)?"ICOG Porto":"ICOG Palmas"):/OPUS/i.test(n)?"OPUS":"";
  abrir(`<header><div><h2>Importar repasse</h2><div class="sub">PDF do extrato (EyecareBI) ou planilha Excel com Data, Paciente, Convênio, Procedimentos, Valor e Repasse</div></div><button class="close" data-close aria-label="Fechar">×</button></header>
  <form id="fImp" class="form">
    <label>Arquivo<input type="file" id="impArq" accept=".pdf,.xlsx,.xls,.csv" required></label>
    <fieldset><legend>Clínica</legend>${radios("impLoc",LOCAIS.map(l=>[l,l]),"")}<span class="err" id="impErrL"></span></fieldset>
    <div id="impPrev" class="meta"></div><div class="err" id="impErr"></div>
    <button class="btn" type="submit" id="impBtn" disabled>Salvar repasse</button></form>`);
  let lido=null, arq=null;
  $("#impArq").addEventListener("change",async e=>{ arq=e.target.files[0]; lido=null; $("#impBtn").disabled=true; $("#impErr").textContent=""; if(!arq) return;
    const g=guess(arq.name); if(g){ const r=document.querySelector(`input[name="impLoc"][value="${g}"]`); if(r) r.checked=true; }
    $("#impPrev").textContent="Lendo o arquivo…";
    try{ lido=await lerArquivoRepasse(arq); const soma=lido.itens.reduce((s,i)=>s+Number(i.valor||0),0);
      const ok=lido.total_informado==null||Math.abs(soma-lido.total_informado)<0.05;
      $("#impPrev").innerHTML=`<b>${lido.itens.length} itens</b> · ${lido.periodo_ini?br(lido.periodo_ini):""} a ${lido.periodo_fim?br(lido.periodo_fim):""}${lido.numero?` · Nº ${esc(lido.numero)}`:""}<br>Soma dos itens: <b>${moeda(soma)}</b>${lido.total_informado!=null?` · total no arquivo: <b>${moeda(lido.total_informado)}</b> ${ok?"✔":"⚠️ diferente"}`:""}`;
      $("#impBtn").disabled=false;
    }catch(err){ $("#impPrev").textContent=""; $("#impErr").textContent=err.message; } });
  $("#fImp").addEventListener("submit",async e=>{ e.preventDefault(); const loc=document.querySelector('input[name="impLoc"]:checked')?.value;
    if(!loc){ $("#impErrL").textContent="Escolha a clínica."; return; } if(!lido) return;
    const dup=S.reps.find(r=>r.local===loc&&((lido.numero&&r.numero===lido.numero)||(r.periodo_ini===lido.periodo_ini&&r.periodo_fim===lido.periodo_fim)));
    if(dup&&!confirmar(`Já existe um repasse de ${loc} com esse número/período. Importar mesmo assim?`)) return;
    $("#impBtn").disabled=true; $("#impBtn").textContent="Salvando…";
    const {data,error}=await sb.from("repasses").insert({local:loc,numero:lido.numero,periodo_ini:lido.periodo_ini,periodo_fim:lido.periodo_fim,total_informado:lido.total_informado!=null?Math.round(lido.total_informado*100)/100:null,subtotais:Object.keys(lido.subtotais||{}).length?lido.subtotais:null,formato:lido.formato,arquivo:arq.name,criado_por:S.user?.email||null}).select().single();
    if(error){ $("#impErr").textContent=error.message; $("#impBtn").disabled=false; $("#impBtn").textContent="Salvar repasse"; return; }
    const rows=lido.itens.map(i=>({repasse_id:data.id,data:i.data,paciente:i.paciente,convenio:i.convenio,procedimento:i.procedimento,categoria:i.categoria,qtd:i.qtd||1,valor_bruto:i.valor_bruto!=null?Math.round(i.valor_bruto*100)/100:null,valor:Math.round(Number(i.valor||0)*100)/100,pagamento:i.pagamento}));
    for(let k=0;k<rows.length;k+=200){ const {error:e2}=await sb.from("repasse_itens").insert(rows.slice(k,k+200)); if(e2){ $("#impErr").textContent=e2.message; return; } }
    fechar(); toast(`Repasse de ${loc} importado ✔ · ${rows.length} itens`); S.repSel=data.id; await carregar(); render(); });
}

function filtroInd(c){
  const f=S.fInd;
  if(f==="convenio") return ehConv(c);
  if(f==="particular") return !ehConv(c);
  if(["cirurgia","injecao","laser"].includes(f)) return c.tipo===f;
  if(f==="travados") return situacaoInd(c).nivel==="late";
  if(f==="atencao") return !!situacaoInd(c).nivel;
  if(f==="alto") return c.interesse==="alto";
  return true;
}

  return `<label class="loc-sel">📍 Local de atendimento<select id="selLocal">${[["","Todos os locais",base.length],...LOCAIS.map(l=>[l,l,base.filter(c=>c.local===l).length]),["sem","Sem local",base.filter(c=>!c.local).length]].filter(([v,,n])=>v!=="sem"||n).map(([v,tx,n])=>`<option value="${v}" ${(S.fLocal||"")===v?"selected":""}>${tx} (${n})</option>`).join("")}</select></label>`;
}
function urlLentes(){ const p=location.pathname; return (p.endsWith("/")||p.endsWith(".html")) ? "lentes.html" : p+"/lentes.html"; }
function telaLentes(){
  return `<div class="sec-head"><div><h2>Simulador de lentes</h2><div class="sub">Para usar na consulta · valores da tabela de preços (ICOG ou OA/OPUS, com ou sem plano)</div></div><button class="btn ghost" data-act="precos">Editar tabela de preços</button></div>
  <iframe id="frLentes" src="${urlLentes()}" title="Simulador de lentes" style="width:100%;height:1900px;border:0;border-radius:18px;background:#f4f7fb"></iframe>`;
}
window.addEventListener("message",e=>{ const d=e.data||{}; if(d.tipo==="altura"){ const f=document.getElementById("frLentes"); if(f&&d.h) f.style.height=(d.h+20)+"px"; } });
function telaInd(){
  const todos=S.casos.filter(c=>[...ABERTAS,"fechado"].includes(c.etapa) && (c.etapa!=="fechado" || c.tipo==="cirurgia" || (c.fechado_em && desde(c.fechado_em)<=7)));
  const base=todos.filter(noLocal).filter(filtroInd);
  const cols = ETAPAS_IND.map(([k,t,desc,prazo])=>{
    const items=base.filter(c=>c.etapa===k).sort((a,b)=>({alto:0,medio:1,baixo:2,fechado:3}[a.interesse||"medio"]-{alto:0,medio:1,baixo:2,fechado:3}[b.interesse||"medio"])||(a.etapa_desde||"").localeCompare(b.etapa_desde||""));
    const n=items.filter(c=>situacaoInd(c).nivel).length;
    return `<section class="col" data-drop="${k}" data-board="ind"><h3><span>${t}</span><span class="count">${items.length}</span></h3><div class="col-desc">${desc}${n?` · <b style="color:var(--warn)">${n} pedindo ação</b>`:""}</div>${items.map(cardInd).join("")||'<div class="empty drop-hint">Solte um card aqui</div>'}</section>`;
  }).join("");
  const perdidos=S.casos.filter(c=>c.etapa==="desistiu"&&noLocal(c)).length;
  const fb=(k,t)=>`<button data-fi="${k}" aria-pressed="${S.fInd===k}">${t}</button>`;
  return `<div class="sec-head"><div><h2>Indicações</h2><div class="sub">Arraste pela alça ⠿ · toque no selo de interesse para mudar · no celular use “→” ou “⋯”</div></div><button class="btn" data-act="novo">+ Nova indicação</button></div>
  ${selLocal(todos)}
  <div class="seg">${fb("todos","Todas")}${fb("atencao","Pedindo ação")}${fb("travados","Convênio parado")}${fb("convenio","Convênio")}${fb("particular","Particular")}${fb("alto","Interesse alto")}${fb("cirurgia","Cirurgia")}${fb("injecao","Injeção")}${fb("laser","Laser")}</div>
  <div class="board" id="board">${cols}</div>
  <section class="col col-out" data-drop="desistiu" data-board="ind"><h3><span>Perdido / não fará</span><span class="count">${perdidos}</span></h3><div class="col-desc">Solte aqui quem desistiu. O card sai do quadro, mas fica no histórico do paciente.</div></section>`;
}

function telaCir(){
  const todasCir=S.casos.filter(c=>c.tipo==="cirurgia"&&ETAPAS_EXE.some(([k])=>k===c.etapa));
  const list=todasCir.filter(noLocal);
  const cols=ETAPAS_EXE.map(([k,t,desc,prazo])=>{
    let items=list.filter(c=>c.etapa===k);
    if(k==="finalizado") items=items.filter(c=>desde(c.etapa_desde)<=60);
    items.sort((a,b)=>k==="agendado"?(a.data_agendada||"").localeCompare(b.data_agendada||""):(a.etapa_desde||"").localeCompare(b.etapa_desde||""));
    return `<section class="col" data-drop="${k}" data-board="exe"><h3><span>${t}</span><span class="count">${items.length}</span></h3><div class="col-desc">${desc}${prazo?` · meta ${prazo} dias`:""}</div>${items.map(cardExe).join("")||'<div class="empty drop-hint">Solte um card aqui</div>'}</section>`;
  }).join("");
  return `<div class="sec-head"><div><h2>Cirurgias fechadas</h2><div class="sub">Do fechamento até a alta · altas dos últimos 60 dias</div></div></div>
  ${selLocal(todasCir)}
  <div class="board" id="board">${cols}</div>`;
}

function telaTrat(){
  const f=S.fTrat;
  const todasTrat = S.casos.filter(c=>c.tipo!=="cirurgia" && !ABERTAS.includes(c.etapa));
  let list = todasTrat.filter(noLocal);
  list = f==="finalizados" ? list.filter(c=>["finalizado","desistiu"].includes(c.etapa)) : list.filter(c=>!["finalizado","desistiu"].includes(c.etapa));
  if(f==="pausa") list=list.filter(c=>statusTrat(c).estado==="pausa");
  else if(f!=="finalizados") list=list.filter(c=>statusTrat(c).estado!=="pausa");
  if(f==="convenio") list=list.filter(ehConv);
  if(f==="particular") list=list.filter(c=>!ehConv(c));
  const ord={late:0,lembrar:1,primeira:2,avaliar:3,agendado:4,ok:5,fim:6,pausa:7};
  list = list.map(c=>[c,statusTrat(c)]).sort((a,b)=>(ord[a[1].estado]-ord[b[1].estado])||((b[1].dU||0)-(a[1].dU||0))).map(x=>x[0]);
  const fb=(k,t)=>`<button data-ft="${k}" aria-pressed="${f===k}">${t}</button>`;
  return `<div class="sec-head"><div><h2>Injeções e laser</h2><div class="sub">Ciclos de 3 aplicações · agendar a partir de D+14 · vence em D+30 · pausa após 60 dias</div></div></div>
  <div class="legend"><span class="chip late">D+30 vencida</span><span class="chip warn">D+14 agendar</span><span class="chip ok">em dia / agendada</span><span class="chip blue">ciclo completo</span></div>
  ${selLocal(todasTrat)}
  <div class="seg">${fb("ativos","Em tratamento")}${fb("convenio","Convênio")}${fb("particular","Particular")}${fb("pausa","Em pausa")}${fb("finalizados","Finalizados")}</div>
  <div class="list">${list.map(cardTrat).join("")||'<div class="empty">Nada por aqui.</div>'}</div>`;
}

function telaPac(){
  const q=S.busca.trim().toLowerCase(), qd=q.replace(/\D/g,"");
  const list=S.pacientes.filter(p=>!q||p.nome.toLowerCase().includes(q)||(qd&&(p.telefone||"").replace(/\D/g,"").includes(qd)));
  return `<div class="sec-head"><div><h2>Pacientes</h2><div class="sub">${S.pacientes.length} cadastrados</div></div><button class="btn" data-act="novo">+ Nova indicação</button></div>
  <div class="filters"><input type="search" id="busca" placeholder="Buscar por nome ou telefone" value="${esc(S.busca)}"></div>
  <div class="list">${list.map(p=>{
    const cs=S.casos.filter(c=>c.paciente_id===p.id);
    return `<div class="item"><div class="row"><div class="name"><button data-pac="${p.id}">${esc(p.nome)}</button></div></div>
      <div class="row">${cs.map(c=>`<span class="chip ${c.tipo==="cirurgia"?"":"blue"}">${TIPO_LABEL[c.tipo]}${c.procedimento?": "+esc(c.procedimento):c.olho?" "+esc(c.olho):""} · ${ETAPA_LABEL[c.etapa]}</span>`).join("")}</div>
      <div class="row" style="justify-content:space-between">${contato(p.telefone)}<button class="btn small ghost" data-pac="${p.id}">Abrir</button></div></div>`;
  }).join("")||'<div class="empty">Nenhum paciente encontrado.</div>'}</div>`;
}

/* ================= Folhas (modais) ================= */
function abrir(html){ $("#sheetRoot").innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; $("#sbg").addEventListener("click",e=>{ if(e.target.id==="sbg"||e.target.closest("[data-close]")) fechar(); }); }
function fechar(){ $("#sheetRoot").innerHTML=""; }
function confirmar(t){ try { return window.confirm(t); } catch(e){ return true; } }

function radios(name, opts, val){ return `<div class="radios">${opts.map(([v,t])=>`<label class="rd"><input type="radio" name="${name}" value="${v}" ${v===val?"checked":""}><span>${t}</span></label>`).join("")}</div>`; }

// Formulário de indicação: novo paciente ou novo procedimento de um paciente existente
const SUBS_CIR=["FACO","PTG","VVPP","FACO + VVPP","Outra"];
function subDe(p){ p=(p||"").toUpperCase(); if(!p) return ""; const f=/FACO|FACECT/.test(p), v=/VVPP|VITRECT/.test(p); if(f&&v) return "FACO + VVPP"; if(f) return "FACO"; if(v) return "VVPP"; if(/PTG|PTERIG/.test(p)) return "PTG"; return "Outra"; }
function detalheDe(p){ if(!p) return ""; const s=subDe(p); if(s==="Outra") return p; const m=p.split(" · "); return m.length>1&&SUBS_CIR.includes(m[0])?m.slice(1).join(" · "):p.toUpperCase()===s?"":p; }
function montaProc(tipo, sub, det){ if(tipo!=="cirurgia") return det||null; if(!sub||sub==="Outra") return det||null; if(det && det.toUpperCase().includes(sub.split(" ")[0])) return det; return det?`${sub} · ${det}`:sub; }
function folhaIndicacao(caso, pacienteId){
  const c = caso || {tipo:"cirurgia", etapa:"indicado", interesse:"medio", pagamento:"particular", data_indicacao: iso(hoje()), paciente_id:pacienteId};
  const novoPac = !c.paciente_id;
  const convAtual = (c.convenio||"").toUpperCase();
  const convSel = c.pagamento!=="convenio" ? "SERVIR" : (CONVENIOS.includes(convAtual) ? convAtual : "OUTROS");
  abrir(`<header><h2>${caso?"Editar indicação":"Nova indicação"}</h2><button class="close" data-close aria-label="Fechar">×</button></header>
  <form id="fi" class="form" novalidate>
    ${novoPac?`<label>Nome do paciente<input id="iNome" required autocomplete="off" placeholder="Nome completo"><span class="err" id="eNome"></span></label>
    <label>Telefone<input id="iTel" inputmode="tel" placeholder="(63) 9____-____"></label>`:`<div class="meta">Paciente: <b>${esc(pacOf(c).nome)}</b></div>`}
    <label>Data da indicação<input type="date" id="iData" value="${c.data_indicacao||iso(hoje())}"></label>
    <fieldset><legend>Local de atendimento</legend>${radios("local", LOCAIS.map(l=>[l,l]), c.local||"")}<span class="err" id="eLocal"></span></fieldset>
    <fieldset><legend>Forma de pagamento</legend>${radios("pag", [["particular","Particular"],["convenio","Convênio"]], c.pagamento||"particular")}</fieldset>
    <fieldset id="fsConv" class="${c.pagamento==="convenio"?"":"hidden"}"><legend>Convênio</legend>${radios("conv", [...CONVENIOS.map(x=>[x,x==="SERVIR"?"Servir":x==="CASSI"?"Cassi":"Caixa"]),["OUTROS","Outros"]], convSel)}
      <input id="iConvOutro" class="${convSel==="OUTROS"?"":"hidden"}" placeholder="Qual convênio? (ex.: IPASGU, Município)" value="${convSel==="OUTROS"?esc(c.convenio||""):""}"></fieldset>
    <fieldset><legend>Procedimento</legend>${radios("tipo", [["cirurgia","Cirurgia"],["injecao","Injeção"],["laser","Laser"]], c.tipo)}</fieldset>
    <fieldset id="fsCir" class="${c.tipo==="cirurgia"?"":"hidden"}"><legend>Tipo de cirurgia</legend>${radios("sub", SUBS_CIR.map(s=>[s,s]), subDe(c.procedimento)||(caso?"Outra":""))}<span class="err" id="eSub"></span></fieldset>
    <label>Detalhe <small>(opcional)</small><input id="iProc" value="${esc(detalheDe(c.procedimento)||"")}" placeholder="Ex.: trifocal, tórica, peeling, gás, calázio"></label>
    <fieldset><legend>Olho</legend>${radios("olho", [["OD","OD"],["OE","OE"],["AO","Ambos"]], (c.olho||"").replace(/.*(OD|OE|AO).*/,"$1")||"")}</fieldset>
    ${caso?"":`<fieldset id="fsPrimOlho" class="hidden"><legend>Ambos os olhos são feitos em dois tempos · qual primeiro?</legend>${radios("prim", [["OD","OD primeiro"],["OE","OE primeiro"]], "OD")}<div class="meta">Vão ser criadas duas indicações (1º e 2º olho), cada uma com o seu andamento.</div></fieldset>`}
    <fieldset><legend>Interesse</legend>${radios("int", [["baixo","Baixo"],["medio","Médio"],["alto","Alto"],["fechado","Fechado"]], c.interesse||"medio")}</fieldset>
    <label id="lValor" class="${c.pagamento==="convenio"?"hidden":""}">Valor do orçamento (opcional)<input id="iValor" inputmode="decimal" placeholder="R$" value="${c.valor??""}"></label>
    ${caso?`<label>Etapa<select id="iEtapa">${Object.entries(ETAPA_LABEL).map(([k,t])=>`<option value="${k}" ${k===c.etapa?"selected":""}>${t}</option>`).join("")}</select></label>
    <div class="grid2"><label>Orçamento/guia enviado em<input type="date" id="iOrc" value="${c.orcamento_em||""}"></label><label>Data da cirurgia<input type="date" id="iAg" value="${c.data_agendada||""}"></label></div>`:""}
    <label>Observações<textarea id="iObs" rows="3" placeholder="Ex.: falta biometria; aguardando laudo; deseja lente multifocal">${esc(c.obs||"")}</textarea></label>
    <button class="btn" type="submit">${caso?"Salvar":"Criar indicação"}</button>
    ${caso?`<button class="btn ghost" type="button" id="iDel" style="color:var(--late)">Excluir</button>`:""}
  </form>`);
  const form=$("#fi");
  const val=n=>form.querySelector(`input[name="${n}"]:checked`)?.value;
  form.addEventListener("change", e=>{
    if(e.target.name==="pag"){ const conv=e.target.value==="convenio"; $("#fsConv").classList.toggle("hidden",!conv); $("#lValor").classList.toggle("hidden",conv); }
    if(e.target.name==="conv"){ $("#iConvOutro").classList.toggle("hidden", e.target.value!=="OUTROS"); }
    if(e.target.name==="local") $("#eLocal").textContent="";
    if(e.target.name==="tipo") $("#fsCir").classList.toggle("hidden", e.target.value!=="cirurgia");
    if(e.target.name==="sub") $("#eSub").textContent="";
    if(["tipo","olho"].includes(e.target.name) && $("#fsPrimOlho")) $("#fsPrimOlho").classList.toggle("hidden", !(val("tipo")==="cirurgia" && val("olho")==="AO"));
  });
  form.addEventListener("input", e=>{ if(e.target.id==="iNome") $("#eNome").textContent=""; });
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    let ok=true;
    if(val("tipo")==="cirurgia" && !val("sub")){ $("#eSub").textContent="Escolha o tipo de cirurgia."; ok=false; }
    if(novoPac && !$("#iNome").value.trim()){ $("#eNome").textContent="Digite o nome do paciente."; ok=false; }
    if(!val("local")){ $("#eLocal").textContent="Escolha o local de atendimento."; ok=false; }
    if(!ok) return;
    let pid=c.paciente_id;
    if(novoPac){
      const nome=$("#iNome").value.trim().toUpperCase();
      const ex=S.pacientes.find(p=>p.nome.toUpperCase()===nome);
      if(ex) pid=ex.id; else { const r=await sb.from("pacientes").insert({nome, telefone:$("#iTel").value.trim()||null}).select().single(); if(r.error){toast(r.error.message);return;} pid=r.data.id; }
    }
    const pag=val("pag"), tipo=val("tipo"), interesse=val("int");
    const conv = pag==="convenio" ? (val("conv")==="OUTROS" ? ($("#iConvOutro").value.trim().toUpperCase()||"OUTROS") : val("conv")) : null;
    const row={paciente_id:pid, tipo, local:val("local"), pagamento:pag, convenio:conv, interesse,
      procedimento:montaProc(tipo, val("sub"), $("#iProc").value.trim()), olho:val("olho")||null, data_indicacao:$("#iData").value||iso(hoje()),
      valor: pag==="particular" && $("#iValor").value ? Number($("#iValor").value.replace(/\./g,"").replace(",",".")) || null : null,
      obs:$("#iObs").value.trim()||null };
    if(tipo!=="cirurgia"){ row.total_sessoes=c.total_sessoes||3; row.intervalo_dias=c.intervalo_dias||VENCE_DIAS; }
    if(caso){ row.etapa=$("#iEtapa").value; row.orcamento_em=$("#iOrc").value||null; row.data_agendada=$("#iAg").value||null; }
    else row.etapa = "indicado";
    if(interesse==="fechado" && ABERTAS.includes(row.etapa)) row.etapa = tipo==="cirurgia" ? "fechado" : "em_tratamento";
    fechar();
    if(!caso && tipo==="cirurgia" && row.olho==="AO"){
      const p1=val("prim")||"OD", p2=p1==="OD"?"OE":"OD", base=row.obs?" · "+row.obs:"";
      await salvar(sb.from("casos").insert([{...row, olho:p1, obs:`1º olho (ambos em dois tempos)${base}`},{...row, olho:p2, obs:`2º olho (depois do ${p1})${base}`}]), `Criadas 2 indicações: 1º ${p1} e 2º ${p2} ✔`);
      return;
    }
    await salvar(caso? sb.from("casos").update(row).eq("id",c.id) : sb.from("casos").insert(row), caso?"Salvo ✔":"Indicação criada ✔");
  });
  if(caso) $("#iDel").addEventListener("click", async ()=>{ if(!confirmar("Excluir esta indicação e o histórico dela?")) return; fechar(); await salvar(sb.from("casos").delete().eq("id",c.id),"Excluído"); });
}

function folhaPaciente(id){
  const p=S.pacientes.find(x=>x.id===id); if(!p) return;
  const cs=S.casos.filter(c=>c.paciente_id===id);
  abrir(`<header><div><h2>${esc(p.nome)}</h2><div class="sub">${esc(p.telefone||"sem telefone")}</div></div><button class="close" data-close aria-label="Fechar">×</button></header>
  <div class="row">${contato(p.telefone)}</div>
  ${cs.map(c=>{
    const head=`<div class="row"><b style="flex:1">${TIPO_LABEL[c.tipo]} ${esc(c.procedimento||"")} ${esc(c.olho||"")}</b><span class="chip">${ETAPA_LABEL[c.etapa]}</span></div>
      <div class="row meta">${chipPag(c)}${c.local?`<span class="chip">${esc(c.local)}</span>`:""}${c.interesse?`<span class="chip ${INTERESSE[c.interesse][1]}">${INTERESSE[c.interesse][0]}</span>`:""}</div>
      <div class="meta">Indicação ${br(c.data_indicacao)} · Orçamento/guia ${br(c.orcamento_em)} · Fechado ${br(c.fechado_em)}${c.tipo==="cirurgia"?` · Cirurgia ${br(c.data_agendada||c.data_realizado)}`:""}</div>`;
    const ses = c.tipo==="cirurgia" ? "" : `<div class="sesslist">${S.sessoes.filter(s=>s.caso_id===c.id).sort((a,b)=>a.ciclo-b.ciclo||a.numero-b.numero).map(s=>`<div class="sess"><span>Ciclo ${s.ciclo} · ${s.numero}ª</span><span>${s.data_realizada?"✔ "+br(s.data_realizada):"📅 "+br(s.data_prevista)}</span></div>`).join("")||'<span class="meta">Nenhuma aplicação registrada</span>'}</div>`;
    return `<div class="box">${head}${ses}${c.obs?`<div class="meta">📝 ${esc(c.obs)}</div>`:""}<div class="actions"><button class="btn small ghost" data-act="editar" data-id="${c.id}">Editar</button></div></div>`;
  }).join("")}
  <div class="actions"><button class="btn small" data-act="novo-do-pac" data-pid="${p.id}">+ Nova indicação para este paciente</button><button class="btn small ghost" data-act="editpac" data-pid="${p.id}">Editar paciente</button></div>`);
}

  const p=S.pacientes.find(x=>x.id===id);

  abrir(`<header><div><h2>${esc(nomeCurto(p.nome))}</h2><div class="sub">${TIPO_LABEL[c.tipo]} ${esc(c.procedimento||"")} · agora em ${ETAPA_LABEL[c.etapa]}</div></div><button class="close" data-close aria-label="Fechar">×</button></header>
