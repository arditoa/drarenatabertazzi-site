<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Controle de Pacientes · Dra. Renata Bertazzi</title>
<link rel="icon" type="image/png" href="../img/simbolo.png">
<link rel="apple-touch-icon" href="../img/simbolo-grande.png">
<meta name="theme-color" content="#163f78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root {
  /* Portal interno: mesma identidade do site (azul do logo + off-white), denso e operacional, pensado para o celular da secretária. */
  --ink:#18294a; --soft:#5b687c; --paper:#f6f4ef; --surface:#fff; --line:#e4ddd0;
  --accent:#1f5aa6; --deep:#163f78; --sage:#4f8a73; --sage-soft:#e3eee8;
  --late:#b4412f; --late-soft:#fbe6e1; --warn:#a86a12; --warn-soft:#fbefd9; --ok:#2f7a55; --ok-soft:#e1f1e8;
  --display:"Marcellus", Georgia, serif; --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-weight:400}
h1,h2{font-family:var(--display)}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 18px;background:linear-gradient(180deg,#efe7da,var(--paper))}
.login-card{width:min(100%,400px);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 22px;display:grid;gap:16px;box-shadow:0 30px 60px -40px rgba(24,41,74,.5)}
.login-card img{width:52px;height:52px;justify-self:center}
.login-card h1{text-align:center;font-size:1.5rem;color:var(--accent)}
.login-card p{margin:0;text-align:center;color:var(--soft);font-size:.92rem}
label{display:grid;gap:6px;font-size:.86rem;font-weight:700;color:var(--soft)}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:700;background:var(--accent);color:#fff;min-height:48px}
.btn:hover{background:var(--deep)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.small{min-height:36px;padding:7px 13px;font-size:.88rem}
.btn.okb{background:var(--ok)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:4px}
.msg{font-size:.9rem;border-radius:10px;padding:10px 12px}
.msg.err{background:var(--late-soft);color:var(--late)}
.msg.info{background:var(--sage-soft);color:#2f5f4c}

/* App */
.app{min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;background:var(--deep);color:#fff;padding:12px 16px calc(12px);display:flex;align-items:center;gap:10px}
.top img{width:30px;height:30px;background:#fff;border-radius:50%;padding:2px}
.top .t{flex:1;min-width:0}
.top b{display:block;font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.03em}
.top span{display:block;font-size:.75rem;color:#c8d7ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .out{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px;font-size:.82rem}
main{max-width:1480px;margin:0 auto;padding:16px 14px 24px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:.74rem;font-weight:700;color:var(--soft);padding:6px 2px;border-radius:12px}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);background:#e8f0fa}
@media (min-width:900px){
  .tabs{position:sticky;top:54px;bottom:auto;border:0;border-bottom:1px solid var(--line);grid-template-columns:repeat(4,max-content);gap:6px;justify-content:center;background:var(--paper);padding:8px}
  .tabs button{grid-auto-flow:column;gap:8px;font-size:.9rem;padding:8px 16px}
  .app{padding-bottom:0}
}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:6px 0 12px}
.sec-head h2{font-size:1.45rem}
.sub{color:var(--soft);font-size:.88rem}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:2px;text-align:left;border-left:5px solid var(--accent)}
.kpi b{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1}
.kpi span{font-size:.82rem;color:var(--soft);font-weight:600}
.kpi.late{border-left-color:var(--late)} .kpi.late b{color:var(--late)}
.kpi.warn{border-left-color:var(--warn)} .kpi.warn b{color:var(--warn)}
.kpi.ok{border-left-color:var(--ok)}

/* Lista/cartões */
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.item.late{border-left:5px solid var(--late)} .item.warn{border-left:5px solid var(--warn)} .item.okc{border-left:5px solid var(--ok)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-weight:700;font-size:1rem;flex:1;min-width:0}
.name button{background:none;border:0;padding:0;font-weight:700;text-align:left;color:var(--ink)}
.meta{font-size:.86rem;color:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 9px;background:#eef1f5;color:var(--soft);white-space:nowrap}
.chip.late{background:var(--late-soft);color:var(--late)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.blue{background:#e5eefa;color:var(--accent)} .chip.sage{background:var(--sage-soft);color:#2f5f4c}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);display:inline-block}
.dots i.on{background:var(--accent)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.contact{display:flex;gap:6px}
.contact a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:.82rem;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink);background:#fff}
.contact a.wa{color:#1f7a4a}
.empty{color:var(--soft);font-size:.92rem;padding:14px;border:1.5px dashed var(--line);border-radius:14px;text-align:center}
.group-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700;font-size:.95rem}
.group-title .count{font-size:.78rem;color:var(--soft);font-weight:700;background:#e9e4da;border-radius:999px;padding:1px 8px}

/* Filtros */
.filters{display:grid;gap:8px;margin-bottom:12px}
@media(min-width:760px){.filters{grid-template-columns:2fr 1fr 1fr}}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.seg button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:.86rem;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* Pipeline (kanban) */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
@media(min-width:900px){.board{grid-auto-columns:minmax(250px,1fr)}}
.col h3 .count{flex:none;margin-left:8px}
.col{scroll-snap-align:start;background:#ece7de;border-radius:18px;padding:10px;display:grid;gap:8px;align-content:start;min-height:200px}
.col h3{font-weight:700;font-size:.92rem;display:flex;justify-content:space-between;padding:4px 4px 2px}

.loc-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.lchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.85rem;color:var(--ink)}
.lchip small{color:var(--soft);font-weight:600;margin-left:2px}
.lchip.on{background:var(--accent);border-color:var(--accent);color:#fff} .lchip.on small{color:#dbe7f7}
.inj-box{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:8px}
.inj-list{display:grid}
.inj-row{display:grid;grid-template-columns:170px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.inj-row.late .inj-nome button{color:var(--late)}
.inj-nome{display:grid;min-width:0} .inj-nome small{color:var(--soft);font-size:.78rem}
.inj-nome button{font-weight:700;text-align:left;background:none;border:0;padding:0;font-size:.95rem;color:var(--ink)}
.inj-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){.inj-row{grid-template-columns:1fr}.inj-acts{justify-content:flex-start}}
.trilha-t.sm{font-size:.8rem;margin-top:10px}
.dias{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 16px}
@media(min-width:760px){.dias{grid-template-columns:repeat(5,minmax(0,1fr))}}
.dia{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:3px;text-align:left;align-content:start;color:var(--ink)}
.dia.sel{border:2px solid var(--accent);background:#eef4fc}
.dia b{font-size:.95rem;text-transform:capitalize}
.dia span{font-size:.82rem;font-weight:700;color:var(--deep)} .dia span small{font-weight:600;color:var(--soft)}
.tk-local{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tk-local h3{font-size:1.05rem;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.tk-g{margin-top:10px} .tk-gt{font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0}
.tk-gt small{font-weight:600;color:var(--soft);font-size:.76rem}
.tk-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tk-row.atrasada .inj-nome button{color:var(--late)}
.tk-txt{color:var(--deep)!important;font-weight:600}
@media(max-width:700px){.tk-row{grid-template-columns:1fr}}
.fchip{border:1px solid transparent;cursor:pointer;font-family:inherit}
.fchip.on{border-color:currentColor;box-shadow:0 0 0 2px currentColor inset}
.fl:not(.late):not(.warn):not(.ok):not(.blue){background:#eceff3;color:var(--soft)}
.fl.blue{background:#e3edf9;color:var(--accent)}
.pos-st{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pos-box{border-left-color:var(--sage);margin-top:14px}
.sheet select,.form select{width:100%}
.acao-box{background:#fff5f2;border:1px solid #f1c7bc;border-left:5px solid var(--late);border-radius:16px;padding:14px;display:grid;gap:8px;margin:4px 0 14px}
.acao-box h3{color:var(--late);display:flex;gap:8px;align-items:center}
.acao-box.ok{background:var(--ok-soft);border-color:#bfe0cc;border-left-color:var(--ok);color:var(--ok);font-size:.9rem}
.loc-sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:.9rem;color:var(--deep);margin:4px 0 14px}
.loc-sel select{width:auto;min-width:240px;font:inherit;font-size:1rem;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
/* Painel por fases */
.trilha-t{font-weight:700;font-size:.9rem;color:var(--soft);margin:14px 0 8px}
.fases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:760px){.fases{grid-template-columns:repeat(5,minmax(0,1fr))}}
.fase{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:2px;text-align:left;align-content:start}
.fase.sel{border:2px solid var(--accent);background:#eef4fc}
.fase b{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1}
.fase .fn1{font-weight:700;font-size:.9rem}
.fase .fn2{font-size:.76rem;color:var(--soft)}
.fl{display:inline-block;font-style:normal;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:4px;justify-self:start}
.fl.late{background:var(--late-soft);color:var(--late)} .fl.warn{background:var(--warn-soft);color:var(--warn)} .fl.ok{background:var(--ok-soft);color:var(--ok)}
.resumo-hoje{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.resumo{margin-top:22px} .resumo summary{cursor:pointer;color:var(--soft)}
/* Painel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-h h3{font-weight:700;font-size:.98rem}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.wk{display:grid;justify-items:center;gap:4px;text-align:center}
.wk-bar{height:70px;width:100%;max-width:56px;background:#eef1f5;border-radius:10px;display:flex;align-items:flex-end;overflow:hidden}
.wk-bar i{display:block;width:100%;background:var(--accent);border-radius:10px 10px 0 0;min-height:4px}
.wk:first-child .wk-bar i{background:var(--warn)}
.wk b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.wk span{font-size:.74rem;color:var(--soft);font-weight:700}
.funnel{display:grid;gap:6px}
.fn{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:8px;background:none;border:0;padding:2px 0;text-align:left;font-size:.85rem;font-weight:700;color:var(--soft)}
.fn i{display:block;height:14px;background:var(--accent);border-radius:999px;opacity:.85}
.fn b{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--ink);text-align:right}
/* Pipeline arrastável */
.col-desc{font-size:.76rem;color:var(--soft);padding:0 4px 4px;line-height:1.3}
.col.drop-on{outline:3px dashed var(--accent);outline-offset:-3px;background:#e2eaf6}
.col-out{margin-top:12px;min-height:0;background:#f1e7e4}
.col-out.drop-on{background:var(--late-soft);outline-color:var(--late)}
.grip{cursor:grab;touch-action:none;user-select:none;font-size:1.25rem;line-height:1;color:var(--soft);padding:6px 6px 6px 2px;margin:-6px 0 -6px -4px}
.grip:active{cursor:grabbing}
.card-cir.dragging{opacity:.35}
.ghost-card{position:fixed;z-index:100;pointer-events:none;transform:rotate(2deg);box-shadow:0 22px 40px -16px rgba(24,41,74,.55);opacity:.95}
.move-list{display:grid;gap:8px}
.move-list .btn[disabled]{opacity:1;cursor:default}
/* Modal */
.sheet-bg{position:fixed;inset:0;background:rgba(15,24,40,.45);z-index:50;display:grid;align-items:end;justify-items:center}
@media(min-width:760px){.sheet-bg{align-items:center}}
.sheet{background:var(--surface);width:min(100%,640px);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px}
@media(min-width:760px){.sheet{border-radius:22px}}
.sheet header{display:flex;justify-content:space-between;align-items:start;gap:10px}
.sheet header h2{font-size:1.35rem}
.close{background:#f0ece5;border:0;border-radius:50%;width:36px;height:36px;font-size:1.2rem;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.sesslist{display:grid;gap:6px}
.sess{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;border-bottom:1px dashed var(--line);padding-bottom:6px}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:11;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;padding:14px 18px;box-shadow:0 14px 30px -12px rgba(24,41,74,.6)}
@media(min-width:900px){.fab{bottom:24px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60}
.footnote{font-size:.78rem;color:var(--soft);text-align:center;margin-top:24px}

/* ===== v3: indicações, interesse, aplicações ===== */
.tabs{grid-template-columns:repeat(6,1fr)}
.tabs button{font-size:.66rem}
@media(min-width:900px){.tabs{grid-template-columns:repeat(6,max-content)}.tabs button{font-size:.9rem}}
.sec-head .btn{white-space:nowrap}
.chip.conv{background:#efe6fb;color:#5b3a99}
.chip.part{background:#e6f3ee;color:#2f6b52}
button.chip{border:0;cursor:pointer;font:inherit;font-size:.74rem;font-weight:700}
.int-b{background:#eef1f5;color:#5b687c}
.int-m{background:var(--warn-soft);color:var(--warn)}
.int-a{background:var(--late-soft);color:var(--late)}
.int-f{background:var(--ok-soft);color:var(--ok)}
.item.info{border-left:5px solid var(--accent)}
.apps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.apps li{border:1.5px dashed var(--line);border-radius:12px;padding:6px 8px;display:grid;gap:1px;font-size:.78rem;color:var(--soft)}
.apps li b{font-size:.92rem;color:var(--soft);font-weight:700}
.apps li.done{border-style:solid;border-color:var(--accent);background:#eef4fc}
.apps li.done b{color:var(--ink)}
.apps li.sched{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.grid-panels{display:grid;gap:12px;margin-bottom:6px}
@media(min-width:900px){.grid-panels{grid-template-columns:1fr 1fr}}
.mini-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini-kpis div{display:grid;gap:0}
.mini-kpis b{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.1}
.mini-kpis span{font-size:.72rem;color:var(--soft);font-weight:700;line-height:1.2}
.fn i.warn{background:var(--warn)} .fn i.late{background:var(--late)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:460px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.linklike{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-align:left}
.form{display:grid;gap:14px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
legend{font-size:.86rem;font-weight:700;color:var(--soft);padding:0;margin-bottom:6px}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.rd{display:inline-flex;font-size:.92rem;font-weight:700;color:var(--ink)}
.rd input{position:absolute;opacity:0;width:1px;height:1px}
.rd span{border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;background:#fff;cursor:pointer}
.rd input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.rd input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.err{font-size:.82rem;color:var(--late);font-weight:700;min-height:0}
.err:empty{display:none}
.col{min-width:0}
.col .item{min-width:0}
.item .chip{white-space:normal;line-height:1.3}
.item .actions{margin-left:auto}
.fab{display:none}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section class="login hidden" id="vLogin">

<div id="sheetRoot"></div>

<script>
/* ================= Configuração ================= */
const SUPABASE_URL = "https://avbmtrvxieetoptmzere.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ohqe8a6rhGEwOImU302jjw_69V8kcJ7"; // chave pública; o acesso é protegido por RLS
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

const LOCAIS = ["OA Palmas","OA Paraíso","ICOG Palmas","ICOG Porto","OPUS"];
const CONVENIOS = ["SERVIR","CASSI","CAIXA"];          // + "Outros" (texto livre)
const TIPO_LABEL = {cirurgia:"Cirurgia",injecao:"Injeção",laser:"Laser"};
const INTERESSE = {baixo:["Baixo","int-b"],medio:["Médio","int-m"],alto:["Alto","int-a"],fechado:["Fechado","int-f"]};

// Quadro de INDICAÇÕES (comercial). prazo = dias "saudáveis" na coluna antes do alerta
const ETAPAS_IND = [
  ["indicado","Nova indicação","Enviar orçamento (particular) ou guia/pedido (convênio)",3],
  ["orcamento","Orçamento / guia enviado","Esperando o paciente ou o convênio responder",7],
  ["aguardando","Aguardando resposta","Particular: decidindo · Convênio: em autorização",15],
  ["fechado","Fechado","Cirurgia: falta agendar",7],
];
// Quadro de EXECUÇÃO das cirurgias (depois de fechado)
const ETAPAS_EXE = [
  ["fechado","Fechado · a agendar","Marcar data no centro cirúrgico",7],
  ["agendado","Agendado","Data marcada",null],
  ["realizado","Realizado","Cirurgia feita",3],
  ["pos_op","Pós-operatório","Retornos 1, 7 e 30 dias",45],
  ["finalizado","Alta","Acompanhamento concluído",null],
];
const ETAPA_LABEL = {indicado:"Nova indicação",orcamento:"Orçamento/guia enviado",aguardando:"Aguardando resposta",fechado:"Fechado",agendado:"Agendado",realizado:"Realizado",pos_op:"Pós-operatório",finalizado:"Alta",em_tratamento:"Em tratamento",desistiu:"Perdido / não fará"};
const ABERTAS = ["indicado","orcamento","aguardando"];
// Prazo para considerar convênio "travado" (dias desde o envio da guia sem fechar)
const PRAZO_CONVENIO = 15, PRAZO_PARTICULAR = 7;
// Injeções/laser: lembrete D+20, vencimento D+30
const LEMBRAR_DIAS = 14, VENCE_DIAS = 30, PAUSA_DIAS = 60;

const S = { tab:"painel", pacientes:[], casos:[], sessoes:[], pos:[], modelos:[], user:null, fInd:"todos", fTrat:"ativos", busca:"" };

/* ================= Utilidades ================= */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoje = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => d ? new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10) : null;
const parse = s => s ? new Date(String(s).slice(0,10)+"T00:00:00") : null;
const addDias = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const diff = (a,b) => Math.round((a-b)/86400000);
const desde = s => s ? diff(hoje(), parse(s)) : null;
const br = s => { if(!s) return "—"; const [y,m,d]=String(s).slice(0,10).split("-"); return `${d}/${m}/${y.slice(2)}`; };
const dm = s => s ? br(s).slice(0,5) : "—";
const plural = (n,s,p) => `${n} ${n===1?s:p}`;
const nomeCurto = n => { const p=String(n||"").toLowerCase().split(/\s+/).filter(Boolean).map(w=>w.length>2?w[0].toUpperCase()+w.slice(1):w); return p.length>3?[p[0],p[1],p[p.length-1]].join(" "):p.join(" "); };
const moeda = v => v==null||v==="" ? "" : Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
function fones(tel){ return String(tel||"").split(/[|/]/).map(s=>s.replace(/\D/g,"")).filter(s=>s.length>=10); }
function contato(tel){
  const f=fones(tel)[0]; if(!f) return '<span class="meta">sem telefone</span>';
  const intl = f.startsWith("55")?f:"55"+f;
  return `<span class="contact"><a href="tel:+${intl}">Ligar</a><a class="wa" href="https://wa.me/${intl}" target="_blank" rel="noopener">WhatsApp</a></span>`;
}
const pacOf = c => S.pacientes.find(p=>p.id===c.paciente_id) || {nome:"?"};
const pagLabel = c => c.pagamento==="particular" ? "Particular" : (c.convenio || "Convênio");
const ehConv = c => c.pagamento==="convenio";
function chipPag(c){ return `<span class="chip ${ehConv(c)?"conv":"part"}">${esc(pagLabel(c))}</span>`; }
function chipInt(c){ const i=INTERESSE[c.interesse||"medio"]; return `<button class="chip ${i[1]}" data-int="${c.id}" title="Toque para mudar o interesse">● ${i[0]}</button>`; }

/* ================= Regras ================= */
// Situação de uma indicação aberta: o que precisa ser feito e se está atrasada
function situacaoInd(c){
  const dEt = desde(c.etapa_desde), dInd = desde(c.data_indicacao || c.criado_em);
  const dEnv = desde(c.orcamento_em);
  if (c.etapa==="indicado" && dEt!==null && dEt>3) return {nivel:"warn", txt:`Há ${plural(dEt,"dia","dias")} sem ${ehConv(c)?"enviar a guia":"enviar orçamento"}`};
  if (["orcamento","aguardando"].includes(c.etapa) && ehConv(c) && dEnv!==null && dEnv>PRAZO_CONVENIO)
    return {nivel:"late", txt:`Convênio parado há ${dEnv} dias · conferir documentos/autorização`};
  if (["orcamento","aguardando"].includes(c.etapa) && !ehConv(c) && dEnv!==null && dEnv>PRAZO_PARTICULAR)
    return {nivel:"warn", txt:`Orçamento sem resposta há ${dEnv} dias · fazer contato`};
  if (c.etapa==="fechado" && c.tipo==="cirurgia" && dEt!==null && dEt>7) return {nivel:"warn", txt:`Fechado há ${dEt} dias e ainda sem data`};
  return {nivel:"", txt: dInd!==null ? `Indicado há ${plural(dInd,"dia","dias")}` : ""};
}

// Injeção/laser: aplicações do ciclo atual, D+20 (lembrar) e D+30 (vence)
function statusTrat(c){
  const ses = S.sessoes.filter(s=>s.caso_id===c.id);
  const ciclo = ses.length ? Math.max(...ses.map(s=>s.ciclo)) : 1;
  const doCiclo = ses.filter(s=>s.ciclo===ciclo).sort((a,b)=>a.numero-b.numero);
  const feitas = doCiclo.filter(s=>s.data_realizada);
  const total = c.total_sessoes || 3;
  const ultima = feitas.length ? feitas.map(s=>s.data_realizada).sort().at(-1) : null;
  const agendada = doCiclo.find(s=>!s.data_realizada && s.data_prevista);
  const dU = ultima ? desde(ultima) : null;
  const lembrar = ultima ? addDias(parse(ultima), LEMBRAR_DIAS) : null;
  const vence = ultima ? addDias(parse(ultima), c.intervalo_dias || VENCE_DIAS) : null;
  let estado="ok", rotulo="";
  if (["finalizado","desistiu"].includes(c.etapa)) { estado="fim"; rotulo=ETAPA_LABEL[c.etapa]; }
  else if (feitas.length >= total) { estado="avaliar"; rotulo=`Ciclo completo (${total}/${total}) · avaliar novo ciclo`; }
  else if (agendada) { estado="agendado"; rotulo=`${feitas.length+1}ª aplicação agendada · ${br(agendada.data_prevista)}`; }
  else if (!ultima) { estado="primeira"; rotulo="1ª aplicação a agendar"; }
  else if (dU >= PAUSA_DIAS) { estado="pausa"; rotulo=`Em pausa · ${dU} dias sem aplicação`; }
  else if (dU >= (c.intervalo_dias||VENCE_DIAS)) { estado="late"; rotulo=`D+${dU} · venceu em ${dm(iso(vence))}`; }
  else if (dU >= LEMBRAR_DIAS) { estado="lembrar"; rotulo=`D+${dU} · agendar próxima (vence ${dm(iso(vence))})`; }
  else { estado="ok"; rotulo=`D+${dU} · lembrete em ${dm(iso(lembrar))}`; }
  const avisado = c.ultimo_contato && ultima && c.ultimo_contato >= ultima && ["late","lembrar"].includes(estado);
  return { ses, ciclo, doCiclo, feitas, total, ultima, agendada, dU, lembrar, vence, estado, rotulo, avisado };
}

/* ================= Dados ================= */
async function carregar(){
  const [p,c,s] = await Promise.all([
    sb.from("pacientes").select("*").order("nome"),
    sb.from("casos").select("*").order("criado_em"),
    sb.from("sessoes").select("*").order("numero"),
  ]);
  const [ps,md] = await Promise.all([sb.from("pos_contatos").select("*"), sb.from("modelos").select("*").order("tipo").order("nome")]);
  S.pos=ps.data||[]; S.modelos=md.data||[];
  const err = p.error||c.error||s.error; if (err) { toast("Erro ao carregar: "+err.message); return; }
  S.pacientes=p.data; S.casos=c.data; S.sessoes=s.data;
}
async function salvar(prom, ok){ const {error} = await prom; if(error){ toast("Não foi possível salvar: "+error.message); return false; } if(ok) toast(ok); await carregar(); render(); return true; }

/* ================= Cartões ================= */
function cardInd(c){
  const p=pacOf(c), st=situacaoInd(c);
  const idx=ETAPAS_IND.findIndex(e=>e[0]===c.etapa);
  const prox = idx>=0 && idx<ETAPAS_IND.length-1 ? ETAPAS_IND[idx+1] : null;
  return `<div class="item card-dd ${st.nivel}" data-card="${c.id}">
    <div class="row"><span class="grip" data-grip="${c.id}" title="Arraste para mudar de etapa" aria-hidden="true">⠿</span><div class="name"><button data-pac="${p.id}">${esc(nomeCurto(p.nome))}</button></div>${c.etapa==="fechado"?"":chipInt(c)}</div>
    <div class="row meta"><span class="chip blue">${TIPO_LABEL[c.tipo]}</span>${chipPag(c)}${c.local?`<span class="chip">${esc(c.local)}</span>`:""}</div>
    ${c.procedimento||c.olho?`<div class="meta"><b style="color:var(--ink)">${esc(c.procedimento||"")}</b>${c.olho?" · "+esc(c.olho):""}${c.valor?` · ${moeda(c.valor)}`:""}</div>`:""}
    ${st.txt?`<div class="row"><span class="chip ${st.nivel==="late"?"late":st.nivel==="warn"?"warn":""}">${esc(st.txt)}</span></div>`:""}
    <div class="row" style="justify-content:space-between">${contato(p.telefone)}
      <span class="actions">${prox&&c.etapa!=="fechado"?`<button class="btn small" data-act="mover-ind" data-id="${c.id}" data-to="${prox[0]}">→ ${prox[0]==="orcamento"?(ehConv(c)?"Guia enviada":"Orçamento enviado"):prox[1]}</button>`:""}<button class="btn small ghost" data-act="menu" data-id="${c.id}" aria-label="Mais opções">⋯</button></span></div>
  </div>`;
}

function cardExe(c){
  const p=pacOf(c), meta=ETAPAS_EXE.find(e=>e[0]===c.etapa), dEt=desde(c.etapa_desde);
  const parado = meta && meta[3] && dEt!==null && dEt>meta[3];
  const idx=ETAPAS_EXE.findIndex(e=>e[0]===c.etapa);
  const prox = idx>=0 && idx<ETAPAS_EXE.length-1 ? ETAPAS_EXE[idx+1] : null;
  const info = c.etapa==="agendado"&&c.data_agendada ? (()=>{const d=diff(parse(c.data_agendada),hoje()); return `📅 ${br(c.data_agendada)} · ${d>=0?`em ${plural(d,"dia","dias")}`:`há ${-d} dias`}`;})()
    : c.data_realizado ? `Operado em ${br(c.data_realizado)}` : c.fechado_em ? `Fechado em ${br(c.fechado_em)}` : "";
  return `<div class="item card-dd ${parado?"warn":""}" data-card="${c.id}">
    <div class="row"><span class="grip" data-grip="${c.id}" aria-hidden="true">⠿</span><div class="name"><button data-pac="${p.id}">${esc(nomeCurto(p.nome))}</button></div>${chipPag(c)}</div>
    <div class="meta"><b style="color:var(--ink)">${esc(c.procedimento||"Cirurgia")}</b>${c.olho?" · "+esc(c.olho):""}${c.local?" · "+esc(c.local):""}</div>
    ${info?`<div class="meta">${info}</div>`:""}
    ${dEt!==null?`<div class="row"><span class="chip ${parado?"warn":""}">${dEt===0?"Entrou hoje nesta etapa":`Há ${plural(dEt,"dia","dias")} nesta etapa`}</span></div>`:""}
    <div class="row" style="justify-content:space-between">${contato(p.telefone)}
      <span class="actions">${prox?`<button class="btn small" data-act="mover-exe" data-id="${c.id}" data-to="${prox[0]}">→ ${prox[1]}</button>`:""}<button class="btn small ghost" data-act="menu" data-id="${c.id}" aria-label="Mais opções">⋯</button></span></div>
  </div>`;
}

function cardTrat(c){
  const st=statusTrat(c), p=pacOf(c);
  const cls = {late:"late",lembrar:"warn",primeira:"warn",avaliar:"info",agendado:"okc",ok:"okc",fim:"",pausa:""}[st.estado];
  const chip = {late:"late",lembrar:"warn",primeira:"warn",avaliar:"blue",agendado:"ok",ok:"ok",fim:"",pausa:""}[st.estado];
  const linhas = Array.from({length:st.total},(_,i)=>{
    const s=st.doCiclo.find(x=>x.numero===i+1);
    if(s&&s.data_realizada) return `<li class="done"><span>${i+1}ª</span><b>${br(s.data_realizada)}</b></li>`;
    if(s&&s.data_prevista) return `<li class="sched"><span>${i+1}ª</span><b>📅 ${br(s.data_prevista)}</b></li>`;
    return `<li><span>${i+1}ª</span><b>—</b></li>`;
  }).join("");
  return `<div class="item ${cls}">
    <div class="row"><div class="name"><button data-pac="${p.id}">${esc(nomeCurto(p.nome))}</button></div><span class="chip ${chip}">${esc(st.rotulo)}</span></div>
    <div class="row meta"><span class="chip blue">${TIPO_LABEL[c.tipo]}</span>${c.olho?`<span class="chip">${esc(c.olho)}</span>`:""}${chipPag(c)}${c.local?`<span class="chip">${esc(c.local)}</span>`:""}${st.ciclo>1?`<span class="chip">Ciclo ${st.ciclo}</span>`:""}</div>
    <ol class="apps">${linhas}</ol>
    ${st.ultima&&!["fim","avaliar"].includes(st.estado)?`<div class="meta">Última aplicação <b style="color:var(--ink)">${br(st.ultima)}</b> · agendar a partir de: <b>${dm(iso(st.lembrar))}</b> · vence D+30: <b>${dm(iso(st.vence))}</b></div>`:""}
    ${st.avisado?`<span class="chip sage">✔ Paciente avisado em ${br(c.ultimo_contato)} · falta agendar</span>`:""}
    ${c.obs?`<div class="meta">📝 ${esc(c.obs)}</div>`:""}
    <div class="row" style="justify-content:space-between">${contato(p.telefone)}
      <span class="actions">${st.estado==="fim"?"":st.estado==="avaliar"
        ?`<button class="btn small" data-act="ciclo" data-id="${c.id}">Novo ciclo</button><button class="btn small ghost" data-act="finalizar" data-id="${c.id}">Finalizar</button>`
        :`${["late","lembrar"].includes(st.estado)&&!st.avisado?`<button class="btn small ghost" data-act="avisei" data-id="${c.id}">Avisei o paciente</button>`:""}<button class="btn small ghost" data-act="agendar" data-id="${c.id}">Agendar</button><button class="btn small okb" data-act="aplicar" data-id="${c.id}">Registrar aplicação</button>`}</span></div>
  </div>`;
}

/* ================= Telas ================= */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===S.tab?"page":"false"));
  const m=$("#main");
  m.innerHTML = ({painel:telaPainel, semana:telaSemana, ind:telaInd, cir:telaCir, trat:telaTrat, pac:telaPac}[S.tab])();
  m.insertAdjacentHTML("beforeend", `<p class="footnote">Dados protegidos · acesso restrito à equipe · ${S.pacientes.length} pacientes cadastrados</p>`);
}

function barras(lista){ const max=Math.max(1,...lista.map(x=>x[1])); return `<div class="funnel">${lista.map(([t,n,go,cls])=>`<button class="fn" ${go?`data-goto="${go}"`:""}><span>${esc(t)}</span><i class="${cls||""}" style="width:${Math.max(3,Math.round(n/max*100))}%"></i><b>${n}</b></button>`).join("")}</div>`; }

function fasesPainel(){
  const vivos = S.casos.filter(c=>!["finalizado","desistiu"].includes(c.etapa) && noLocal(c));
  const cir = vivos.filter(c=>c.tipo==="cirurgia"), inj = vivos.filter(c=>c.tipo!=="cirurgia");
  const alInd = c=>{ const n=situacaoInd(c).nivel; return n==="late"?2:n==="warn"?1:0; };
  const alTrat = c=>{ const s=statusTrat(c); if(s.estado==="late") return 2; if(s.estado==="lembrar"&&!s.avisado) return 1; if(s.estado==="primeira"&&desde(c.etapa_desde)>7) return 1; return 0; };
  const estTrat = c=>statusTrat(c).estado;
  return [
    {id:"c1", trilha:"cir", nome:"Indicado", sub:"enviar orçamento/guia", casos:cir.filter(c=>c.etapa==="indicado"), al:alInd, card:cardInd},
    {id:"c2", trilha:"cir", nome:"Orçamento enviado", sub:"aguardando resposta", casos:cir.filter(c=>["orcamento","aguardando"].includes(c.etapa)), al:alInd, card:cardInd},
    {id:"c3", trilha:"cir", nome:"Fechado", sub:"falta agendar", casos:cir.filter(c=>c.etapa==="fechado"), al:alInd, card:cardExe},
    {id:"c4", trilha:"cir", nome:"Agendado", sub:"data marcada", casos:cir.filter(c=>c.etapa==="agendado").sort((a,b)=>(a.data_agendada||"").localeCompare(b.data_agendada||"")), al:()=>0, card:cardExe},
    {id:"c5", trilha:"cir", nome:"Operado", sub:"pós-op até a alta", casos:cir.filter(c=>["realizado","pos_op"].includes(c.etapa)), al:()=>0, card:cardExe},
    {id:"i1", trilha:"inj", nome:"Indicado", sub:"enviar orçamento/guia", casos:inj.filter(c=>c.etapa==="indicado"), al:alInd, card:cardInd},
    {id:"i2", trilha:"inj", nome:"Aguardando", sub:"resposta / autorização", casos:inj.filter(c=>["orcamento","aguardando"].includes(c.etapa)), al:alInd, card:cardInd},

function diasSemana(){

function tarefasSemana(){
  const h=hoje(), dias=diasSemana(), fim=dias[4];
  const out=[], pausa=[], antigas=[];
  for(const c of S.casos){
    if(["finalizado","desistiu"].includes(c.etapa)) continue;
    if(ABERTAS.includes(c.etapa)){
      const si=situacaoInd(c); const ctt=c.ultimo_contato&&desde(c.ultimo_contato)<7;
      const idade=desde(c.etapa_desde||c.data_indicacao||c.criado_em)??0;
      if(idade>PAUSA_DIAS) antigas.push({c,g:"antiga",txt:`${ETAPA_LABEL[c.etapa]} há ${idade} dias${c.local?" · "+c.local:""}`});
      else if(si.nivel && !ctt) out.push({c,g:"cobrar",txt:si.txt,nivel:si.nivel});
      continue;
    }
    if(c.tipo==="cirurgia"){
      if(c.etapa==="fechado") out.push({c,g:"ciragendar",txt:`Fechado há ${desde(c.etapa_desde)??"?"} dias`});
      if(c.etapa==="agendado"&&c.data_agendada){ const dt=parse(c.data_agendada); if(dt>=h&&dt<=fim) out.push({c,g:"cirdia",data:dt,txt:`Cirurgia ${br(c.data_agendada)}`}); }
      continue;
    }
    const st=statusTrat(c), prox=`${Math.min(st.feitas.length+1,st.total)}ª de ${st.total}`;
    if(st.estado==="pausa"){ pausa.push({c,st}); continue; }
    if(st.estado==="agendado"){ const dt=parse(st.agendada.data_prevista);
      if(dt<h) out.push({c,g:"atrasada",txt:`Estava marcada para ${br(st.agendada.data_prevista)} · ${prox}`,st});
      else if(dt<=fim) out.push({c,g:"aplicar",data:dt,txt:`${prox} · marcada ${dm(st.agendada.data_prevista)}`,st});
      continue; }
    if(st.estado==="late") out.push({c,g:"atrasada",txt:`${st.dU} dias da última (${dm(st.ultima)}) · ${prox}`,st});
    else if(st.estado==="lembrar"&&!st.avisado) out.push({c,g:"agendar",txt:`Última ${dm(st.ultima)} · fazer até ${dm(iso(st.vence))} · ${prox}`,st});
    else if(st.estado==="primeira") out.push({c,g:"primeira",txt:`Fechado ${c.fechado_em?br(c.fechado_em):""}`,st});
    else if(st.estado==="avaliar") out.push({c,g:"reavaliar",txt:`Ciclo ${st.ciclo} completo · última ${dm(st.ultima)}`,st});
  }
  const porDia=dias.map(()=>[]), semLocal=[];
  for(const t of out){
    let i=-1;
    if(t.data) i=dias.findIndex(d=>diff(d,t.data)===0);
    else if(t.c.local) i=dias.findIndex(d=>(AGENDA[d.getDay()]||[]).some(([l])=>l===t.c.local));
    if(i<0){ if(!t.c.local) semLocal.push(t); else if(t.data) {} else semLocal.push(t); continue; }
    porDia[i].push(t);
  }
  return {dias,porDia,semLocal,pausa,antigas};
}

/* ===== Pós-procedimento: contato e WhatsApp ===== */
const POS_DIAS = 15;
function procsRecentes(){
  const ini=addDias(hoje(),-POS_DIAS), out=[];
  for(const c of S.casos){
    if(!noLocal(c)) continue;
    if(c.tipo==="cirurgia" && c.data_realizado && ["realizado","pos_op","finalizado"].includes(c.etapa) && parse(c.data_realizado)>=ini)
      out.push({c,ses:null,data:c.data_realizado,rot:`Cirurgia ${c.procedimento||""}`.trim()});
  }
  for(const s of S.sessoes){
    if(!s.data_realizada || parse(s.data_realizada)<ini) continue;
    const c=S.casos.find(x=>x.id===s.caso_id); if(!c||!noLocal(c)) continue;
    out.push({c,ses:s,data:s.data_realizada,rot:`${TIPO_LABEL[c.tipo]}${c.olho?" "+c.olho:""} · ${s.numero}ª aplicação`});
  }
  for(const x of out) x.pos=S.pos.find(p=>p.caso_id===x.c.id && (p.sessao_id||null)===(x.ses?x.ses.id:null))||null;
  return out.sort((a,b)=>b.data.localeCompare(a.data));
}
function blocoPos(){
  const L=procsRecentes();
  const semCont=L.filter(x=>!x.pos?.contato_em), semWa=L.filter(x=>!x.pos?.whatsapp_em), ok=L.filter(x=>x.pos?.contato_em&&x.pos?.whatsapp_em);
  const f=S.fPos||"pend";
  const vis = f==="contato"?semCont : f==="whats"?semWa : f==="ok"?ok : L.filter(x=>!(x.pos?.contato_em&&x.pos?.whatsapp_em));
  const chip=(k,cls,n,t)=>`<button class="fl ${cls} fchip ${f===k?"on":""}" data-fpos="${k}">${n} ${t}</button>`;
  const nomeMod=id=>{ const m=S.modelos.find(x=>x.id===id); return m?esc(m.nome):""; };
  const linhas=vis.map(x=>{ const c=x.c,p=pacOf(c),key=`${c.id}|${x.ses?x.ses.id:""}`;
    const sc=x.pos?.contato_em?`<span class="fl ok">✔ Contato ${dm(x.pos.contato_em)}</span>`:`<span class="fl warn">Contato pendente</span>`;
    const sw=x.pos?.whatsapp_em?`<span class="fl ok">✔ WhatsApp ${dm(x.pos.whatsapp_em)}${x.pos.modelo_msg?" · "+nomeMod(x.pos.modelo_msg):""}${x.pos.modelo_video?" · 🎬 "+nomeMod(x.pos.modelo_video):""}</span>`:`<span class="fl warn">WhatsApp pendente</span>`;
    return `<div class="tk-row"><div class="inj-nome"><button class="linklike" data-pac="${p.id}">${esc(nomeCurto(p.nome))}</button><small>${esc(x.rot)} · ${br(x.data)}${c.local?" · "+esc(c.local):""}</small><div class="pos-st">${sc}${sw}</div></div>
    <div class="inj-acts">${x.pos?.contato_em?"":`<button class="btn small ghost" data-act="pos-contato" data-key="${key}">Contato feito</button>`}<button class="btn small ${x.pos?.whatsapp_em?"ghost":"okb"}" data-act="pos-whats" data-key="${key}">${x.pos?.whatsapp_em?"Reenviar":"Enviar WhatsApp"}</button></div></div>`; }).join("");
  return `<div class="inj-box pos-box">
    <div class="panel-h"><h3>📲 Pós-procedimento · últimos ${POS_DIAS} dias</h3><button class="linkbtn" data-act="modelos">Modelos de mensagem e vídeo →</button></div>
    <div class="resumo-hoje">${chip("pend","warn",L.length-ok.length,"pendentes")}${chip("contato","warn",semCont.length,"sem contato")}${chip("whats","warn",semWa.length,"sem WhatsApp")}${chip("ok","ok",ok.length,"concluídos")}</div>

function achaProc(key){ const [cid,sid]=key.split("|"); return procsRecentes().find(x=>x.c.id===cid && (x.ses?x.ses.id:"")===sid) || (()=>{ const c=S.casos.find(x=>x.id===cid); const s=sid?S.sessoes.find(x=>x.id===sid):null; return {c,ses:s,data:s?s.data_realizada:c.data_realizado,rot:"",pos:S.pos.find(p=>p.caso_id===cid&&(p.sessao_id||"")===sid)||null}; })(); }
async function salvaPos(x, campos){
  const row={...campos, atualizado_por:S.user?.email||null};
  if(x.pos) return salvar(sb.from("pos_contatos").update(row).eq("id",x.pos.id), campos.contato_em?"Contato registrado ✔":"WhatsApp registrado ✔");

  $("#fw").addEventListener("submit",e=>{ e.preventDefault(); if(f){ const intl=f.length<=11?"55"+f:f; window.open(`https://wa.me/${intl}?text=${encodeURIComponent($("#wTxt").value)}`,"_blank","noopener"); } grava(); });

function filtroInd(c){
  const f=S.fInd;
  if(f==="convenio") return ehConv(c);
  if(f==="particular") return !ehConv(c);
  if(["cirurgia","injecao","laser"].includes(f)) return c.tipo===f;
  if(f==="travados") return situacaoInd(c).nivel==="late";
  if(f==="atencao") return !!situacaoInd(c).nivel;
  if(f==="alto") return c.interesse==="alto";
  return true;
}

  base=base||S.casos;

function telaTrat(){
  const f=S.fTrat;
  const todasTrat = S.casos.filter(c=>c.tipo!=="cirurgia" && !ABERTAS.includes(c.etapa));
  let list = todasTrat.filter(noLocal);
  list = f==="finalizados" ? list.filter(c=>["finalizado","desistiu"].includes(c.etapa)) : list.filter(c=>!["finalizado","desistiu"].includes(c.etapa));
  if(f==="pausa") list=list.filter(c=>statusTrat(c).estado==="pausa");
  else if(f!=="finalizados") list=list.filter(c=>statusTrat(c).estado!=="pausa");
  if(f==="convenio") list=list.filter(ehConv);
  if(f==="particular") list=list.filter(c=>!ehConv(c));
  const ord={late:0,lembrar:1,primeira:2,avaliar:3,agendado:4,ok:5,fim:6,pausa:7};
  list = list.map(c=>[c,statusTrat(c)]).sort((a,b)=>(ord[a[1].estado]-ord[b[1].estado])||((b[1].dU||0)-(a[1].dU||0))).map(x=>x[0]);
  const fb=(k,t)=>`<button data-ft="${k}" aria-pressed="${f===k}">${t}</button>`;
  return `<div class="sec-head"><div><h2>Injeções e laser</h2><div class="sub">Ciclos de 3 aplicações · agendar a partir de D+14 · vence em D+30 · pausa após 60 dias</div></div></div>

}

  const form=$("#fi");
  form.addEventListener("change", e=>{
    if(e.target.name==="pag"){ const conv=e.target.value==="convenio"; $("#fsConv").classList.toggle("hidden",!conv); $("#lValor").classList.toggle("hidden",conv); }
    if(e.target.name==="conv"){ $("#iConvOutro").classList.toggle("hidden", e.target.value!=="OUTROS"); }
    if(e.target.name==="local") $("#eLocal").textContent="";
  });
  form.addEventListener("input", e=>{ if(e.target.id==="iNome") $("#eNome").textContent=""; });
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    const val=n=>form.querySelector(`input[name="${n}"]:checked`)?.value;
    let ok=true;
    if(novoPac && !$("#iNome").value.trim()){ $("#eNome").textContent="Digite o nome do paciente."; ok=false; }
    if(!val("local")){ $("#eLocal").textContent="Escolha o local de atendimento."; ok=false; }
    if(!ok) return;
    let pid=c.paciente_id;
    if(novoPac){
      const nome=$("#iNome").value.trim().toUpperCase();
      const ex=S.pacientes.find(p=>p.nome.toUpperCase()===nome);
      if(ex) pid=ex.id; else { const r=await sb.from("pacientes").insert({nome, telefone:$("#iTel").value.trim()||null}).select().single(); if(r.error){toast(r.error.message);return;} pid=r.data.id; }
    }
    const pag=val("pag"), tipo=val("tipo"), interesse=val("int");
    const conv = pag==="convenio" ? (val("conv")==="OUTROS" ? ($("#iConvOutro").value.trim().toUpperCase()||"OUTROS") : val("conv")) : null;
    const row={paciente_id:pid, tipo, local:val("local"), pagamento:pag, convenio:conv, interesse,
      procedimento:$("#iProc").value.trim()||null, olho:$("#iOlho").value||null, data_indicacao:$("#iData").value||iso(hoje()),
      valor: pag==="particular" && $("#iValor").value ? Number($("#iValor").value.replace(/\./g,"").replace(",",".")) || null : null,
      obs:$("#iObs").value.trim()||null };
    if(tipo!=="cirurgia"){ row.total_sessoes=c.total_sessoes||3; row.intervalo_dias=c.intervalo_dias||VENCE_DIAS; }
    if(caso){ row.etapa=$("#iEtapa").value; row.orcamento_em=$("#iOrc").value||null; row.data_agendada=$("#iAg").value||null; }
    else row.etapa = "indicado";
    if(interesse==="fechado" && ABERTAS.includes(row.etapa)) row.etapa = tipo==="cirurgia" ? "fechado" : "em_tratamento";
    fechar();
    await salvar(caso? sb.from("casos").update(row).eq("id",c.id) : sb.from("casos").insert(row), caso?"Salvo ✔":"Indicação criada ✔");
  });
  if(caso) $("#iDel").addEventListener("click", async ()=>{ if(!confirmar("Excluir esta indicação e o histórico dela?")) return; fechar(); await salvar(sb.from("casos").delete().eq("id",c.id),"Excluído"); });
}

function folhaPaciente(id){
  const p=S.pacientes.find(x=>x.id===id); if(!p) return;
  const cs=S.casos.filter(c=>c.paciente_id===id);
  abrir(`<header><div><h2>${esc(p.nome)}</h2><div class="sub">${esc(p.telefone||"sem telefone")}</div></div><button class="close" data-close aria-label="Fechar">×</button></header>
  <div class="row">${contato(p.telefone)}</div>
  ${cs.map(c=>{
    const head=`<div class="row"><b style="flex:1">${TIPO_LABEL[c.tipo]} ${esc(c.procedimento||"")} ${esc(c.olho||"")}</b><span class="chip">${ETAPA_LABEL[c.etapa]}</span></div>
      <div class="row meta">${chipPag(c)}${c.local?`<span class="chip">${esc(c.local)}</span>`:""}${c.interesse?`<span class="chip ${INTERESSE[c.interesse][1]}">${INTERESSE[c.interesse][0]}</span>`:""}</div>
      <div class="meta">Indicação ${br(c.data_indicacao)} · Orçamento/guia ${br(c.orcamento_em)} · Fechado ${br(c.fechado_em)}${c.tipo==="cirurgia"?` · Cirurgia ${br(c.data_agendada||c.data_realizado)}`:""}</div>`;
    const ses = c.tipo==="cirurgia" ? "" : `<div class="sesslist">${S.sessoes.filter(s=>s.caso_id===c.id).sort((a,b)=>a.ciclo-b.ciclo||a.numero-b.numero).map(s=>`<div class="sess"><span>Ciclo ${s.ciclo} · ${s.numero}ª</span><span>${s.data_realizada?"✔ "+br(s.data_realizada):"📅 "+br(s.data_prevista)}</span></div>`).join("")||'<span class="meta">Nenhuma aplicação registrada</span>'}</div>`;
    return `<div class="box">${head}${ses}${c.obs?`<div class="meta">📝 ${esc(c.obs)}</div>`:""}<div class="actions"><button class="btn small ghost" data-act="editar" data-id="${c.id}">Editar</button></div></div>`;
  }).join("")}
  <div class="actions"><button class="btn small" data-act="novo-do-pac" data-pid="${p.id}">+ Nova indicação para este paciente</button><button class="btn small ghost" data-act="editpac" data-pid="${p.id}">Editar paciente</button></div>`);
}

function folhaPacEdit(id){
  const p=S.pacientes.find(x=>x.id===id);
  abrir(`<header><h2>Editar paciente</h2><button class="close" data-close aria-label="Fechar">×</button></header>
  <form id="fp" class="form"><label>Nome<input id="pNome" value="${esc(p.nome)}" required></label><label>Telefone(s)<input id="pTel" value="${esc(p.telefone||"")}" inputmode="tel"></label><label>Observações<textarea id="pObs" rows="3">${esc(p.obs||"")}</textarea></label><button class="btn" type="submit">Salvar</button></form>`);
  $("#fp").addEventListener("submit", async e=>{ e.preventDefault(); const row={nome:$("#pNome").value.trim(),telefone:$("#pTel").value.trim()||null,obs:$("#pObs").value.trim()||null}; fechar(); await salvar(sb.from("pacientes").update(row).eq("id",id),"Paciente atualizado"); });
}

function folhaData(titulo, rotulo, valor, onOk){
  abrir(`<header><h2>${titulo}</h2><button class="close" data-close aria-label="Fechar">×</button></header>
  <form id="fd" class="form"><label>${rotulo}<input type="date" id="fdData" value="${valor}" required></label><button class="btn" type="submit">Salvar</button></form>`);
  $("#fd").addEventListener("submit",e=>{ e.preventDefault(); const v=$("#fdData").value; if(!v) return; fechar(); onOk(v); });
}

function folhaMenu(c){
  const p=pacOf(c);
  const opts = c.tipo==="cirurgia" ? [...ETAPAS_IND.slice(0,3),...ETAPAS_EXE].map(e=>[e[0],e[1]]) : [...ETAPAS_IND.slice(0,3).map(e=>[e[0],e[1]]),["fechado","Fechado · iniciar aplicações"]];
  abrir(`<header><div><h2>${esc(nomeCurto(p.nome))}</h2><div class="sub">${TIPO_LABEL[c.tipo]} ${esc(c.procedimento||"")} · agora em ${ETAPA_LABEL[c.etapa]}</div></div><button class="close" data-close aria-label="Fechar">×</button></header>
  <div class="move-list">${[...opts,["desistiu","Perdido / não fará"]].map(([k,t])=>`<button class="btn ${k===c.etapa?"":"ghost"}" data-moveto="${k}" ${k===c.etapa?"disabled":""}>${k===c.etapa?"● ":""}${t}</button>`).join("")}</div>
  <button class="btn ghost" data-act="editar" data-id="${c.id}">Editar dados da indicação</button>`);
  document.querySelectorAll("[data-moveto]").forEach(b=>b.addEventListener("click",()=>{ fechar(); moverPara(c,b.dataset.moveto); }));
}

/* ================= Mover cards ================= */
async function moverPara(c, to){
  const id=c.id;
  if(to==="fechado" && c.tipo!=="cirurgia"){ await salvar(sb.from("casos").update({etapa:"em_tratamento"}).eq("id",id),"Fechado ✔ · aparece em Injeção/Laser para agendar a 1ª aplicação"); return; }
  if(to==="agendado") return folhaData("Agendar cirurgia","Data da cirurgia", c.data_agendada||iso(hoje()), v=>salvar(sb.from("casos").update({etapa:"agendado",data_agendada:v}).eq("id",id),"Cirurgia agendada ✔"));
  if(to==="realizado") return folhaData("Cirurgia realizada","Data da cirurgia", c.data_agendada||iso(hoje()), v=>salvar(sb.from("casos").update({etapa:"realizado",data_realizado:v}).eq("id",id),"Cirurgia realizada ✔"));
  if(to==="orcamento") return folhaData(ehConv(c)?"Guia / pedido enviado ao convênio":"Orçamento enviado", "Data do envio", iso(hoje()), v=>salvar(sb.from("casos").update({etapa:"orcamento",orcamento_em:v}).eq("id",id), ehConv(c)?"Guia enviada ✔ · o prazo do convênio começa a contar":"Orçamento enviado ✔"));
  if(to==="desistiu" && !confirmar("Marcar como perdido / não fará?")) return;
  await salvar(sb.from("casos").update({etapa:to}).eq("id",id), `Movido para ${ETAPA_LABEL[to]} ✔`);
}

/* ================= Ações ================= */
async function acao(act, el){
  const id=el.dataset.id; const c=S.casos.find(x=>x.id===id);
  if(act==="novo") return folhaIndicacao();
  if(act==="novo-do-pac") return folhaIndicacao(undefined, el.dataset.pid);
  if(act==="editar") return folhaIndicacao(c);
  if(act==="editpac") return folhaPacEdit(el.dataset.pid);
  if(act==="menu") return folhaMenu(c);
  if(act==="mover-ind"||act==="mover-exe") return moverPara(c, el.dataset.to);
  if(act==="pos-contato") return salvaPos(achaProc(el.dataset.key),{contato_em:iso(hoje())});
  if(act==="pos-whats") return folhaWhats(el.dataset.key);
  if(act==="modelos") return folhaModelos();
  if(act==="mod-del"){ if(confirmar("Excluir este modelo?")){ if(await salvar(sb.from("modelos").delete().eq("id",el.dataset.mid),"Modelo excluído")) folhaModelos(); } return; }
  if(act==="cobrei") return salvar(sb.from("casos").update({ultimo_contato:iso(hoje())}).eq("id",id),"Cobrança registrada ✔ · sai da lista por 7 dias");
  if(act==="avisei") return salvar(sb.from("casos").update({ultimo_contato:iso(hoje())}).eq("id",id),"Marcado: paciente avisado ✔");
  if(act==="aplicar"){
    const st=statusTrat(c);
    return folhaData(`Registrar ${st.feitas.length+1}ª aplicação`,"Data da aplicação", st.agendada?.data_prevista||iso(hoje()), async v=>{
      const pend=st.doCiclo.find(s=>!s.data_realizada);
      const ok = pend ? await salvar(sb.from("sessoes").update({data_realizada:v}).eq("id",pend.id))
                      : await salvar(sb.from("sessoes").insert({caso_id:c.id,ciclo:st.ciclo,numero:st.feitas.length+1,data_realizada:v}));
      if(ok) await salvar(sb.from("casos").update({etapa:"em_tratamento",ultimo_contato:null}).eq("id",c.id),`Aplicação de ${br(v)} registrada ✔ · lembrete em ${dm(iso(addDias(parse(v),LEMBRAR_DIAS)))}`);
    });
  }
  if(act==="agendar"){
    const st=statusTrat(c);
    const sug = st.ultima ? iso(addDias(parse(st.ultima), c.intervalo_dias||VENCE_DIAS)) : iso(hoje());
    return folhaData(`Agendar ${st.feitas.length+1}ª aplicação`,"Data", st.agendada?.data_prevista||sug, async v=>{
      const pend=st.doCiclo.find(s=>!s.data_realizada);
      await salvar(pend ? sb.from("sessoes").update({data_prevista:v}).eq("id",pend.id) : sb.from("sessoes").insert({caso_id:c.id,ciclo:st.ciclo,numero:st.feitas.length+1,data_prevista:v}),"Agendado ✔");
    });
  }
  if(act==="ciclo"){
    const st=statusTrat(c);
    return folhaData("Iniciar novo ciclo (3 aplicações)","Data prevista da 1ª aplicação", iso(addDias(st.ultima?parse(st.ultima):hoje(), c.intervalo_dias||VENCE_DIAS)), v=>salvar(sb.from("sessoes").insert({caso_id:c.id,ciclo:st.ciclo+1,numero:1,data_prevista:v}),"Novo ciclo criado ✔"));
  }
  if(act==="finalizar"){ if(confirmar("Finalizar o tratamento deste paciente?")) return salvar(sb.from("casos").update({etapa:"finalizado"}).eq("id",id),"Tratamento finalizado"); }
}

async function ciclarInteresse(id){
  const c=S.casos.find(x=>x.id===id); const ordem=["baixo","medio","alto"];
  const novo = ordem[(ordem.indexOf(c.interesse||"medio")+1)%3];
  c.interesse=novo; render();
  const {error}=await sb.from("casos").update({interesse:novo}).eq("id",id);
  if(error){ toast("Não foi possível salvar: "+error.message); await carregar(); render(); } else toast(`Interesse: ${INTERESSE[novo][0]}`);
}

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-acaotg],[data-fpag],[data-finj],[data-fpos],[data-dia],[data-floc],[data-fase],[data-tab],[data-goto],[data-act],[data-pac],[data-ft],[data-fi],[data-int]"); if(!t) return;
  if(t.dataset.int){ ciclarInteresse(t.dataset.int); return; }
  if(t.dataset.dia!==undefined){ S.dia=+t.dataset.dia; render(); return; }
  if(t.dataset.floc!==undefined){ S.fLocal=t.dataset.floc; S.fase=null; render(); return; }
  if(t.dataset.fase){ S.fase = S.fase===t.dataset.fase ? null : t.dataset.fase; render(); return; }
  if(t.dataset.acaotg){ S.acaoAberta = S.acaoAberta!==true; render(); return; }
  if(t.dataset.fpag!==undefined){ S.fPag=t.dataset.fpag; render(); return; }
  if(t.dataset.finj!==undefined){ S.fInj = S.fInj===t.dataset.finj ? null : t.dataset.finj; render(); return; }
  if(t.dataset.fpos!==undefined){ S.fPos=t.dataset.fpos; render(); return; }
  if(t.dataset.tab||t.dataset.goto){ S.tab=t.dataset.tab||t.dataset.goto; if(t.dataset.f) S.fInd=t.dataset.f; fechar(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.act){ acao(t.dataset.act,t); return; }
  if(t.dataset.pac){ folhaPaciente(t.dataset.pac); return; }
  if(t.dataset.ft!==undefined){ S.fTrat=t.dataset.ft; render(); return; }
  if(t.dataset.fi!==undefined){ S.fInd=t.dataset.fi; render(); return; }
});
document.addEventListener("change", e=>{ if(e.target.id==="selLocal"){ S.fLocal=e.target.value; S.fase=null; render(); } });
document.addEventListener("input", e=>{ if(e.target.id==="busca"){ S.busca=e.target.value; const pos=e.target.selectionStart; render(); const b=$("#busca"); b.focus(); b.setSelectionRange(pos,pos); } });
$("#fab").addEventListener("click", ()=>folhaIndicacao());
document.addEventListener("keydown", e=>{ if(e.key==="Escape") fechar(); });

/* ---------- Arrastar e soltar (mouse e toque) ---------- */
let drag=null;
document.addEventListener("pointerdown", e=>{
  const g=e.target.closest("[data-grip]"); if(!g) return;
  const card=g.closest("[data-card]"); if(!card) return;
  e.preventDefault();
  const r=card.getBoundingClientRect();
  const ghost=card.cloneNode(true); ghost.classList.add("ghost-card"); ghost.style.width=r.width+"px";
  document.body.appendChild(ghost); card.classList.add("dragging");
  drag={id:card.dataset.card, card, ghost, dx:e.clientX-r.left, dy:e.clientY-r.top, over:null};
  moveGhost(e);
});
function moveGhost(e){
  if(!drag) return;
  drag.ghost.style.left=(e.clientX-drag.dx)+"px"; drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  drag.ghost.style.display="none"; const el=document.elementFromPoint(e.clientX,e.clientY); drag.ghost.style.display="";
  const col=el&&el.closest("[data-drop]");
  if(drag.over&&drag.over!==col) drag.over.classList.remove("drop-on");
  if(col){ col.classList.add("drop-on"); drag.over=col; } else drag.over=null;
  const board=$("#board"); if(board){ const b=board.getBoundingClientRect(); if(e.clientX>b.right-40) board.scrollLeft+=14; else if(e.clientX<b.left+40) board.scrollLeft-=14; }
}
document.addEventListener("pointermove", e=>{ if(drag){ e.preventDefault(); moveGhost(e); } }, {passive:false});
document.addEventListener("pointerup", ()=>{
  if(!drag) return;
  const {id,card,ghost,over}=drag; drag=null;
  ghost.remove(); card.classList.remove("dragging"); if(over) over.classList.remove("drop-on");
  const c=S.casos.find(x=>x.id===id);
  if(over&&c&&over.dataset.drop!==c.etapa) moverPara(c, over.dataset.drop);
});
document.addEventListener("pointercancel", ()=>{ if(drag){ drag.ghost.remove(); drag.card.classList.remove("dragging"); drag.over?.classList.remove("drop-on"); drag=null; } });

/* ================= Autenticação ================= */
function mostrar(v){ ["vLogin","vPass","vDenied","vApp"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==v)); }
function msg(el,t,tipo="err"){ el.textContent=t; el.className="msg "+tipo; }

let modoSenha = /type=(invite|recovery)/.test(location.hash);

async function entrar(session){
  if(!session){ mostrar("vLogin"); return; }
  if(modoSenha){ mostrar("vPass"); return; }
  S.user=session.user;
  const {data,error}=await sb.from("usuarios_autorizados").select("email,nome").eq("email",session.user.email.toLowerCase()).maybeSingle();
  if(error||!data){ $("#deniedTxt").textContent=`O e-mail ${session.user.email} ainda não tem permissão para ver os pacientes. Peça à Dra. Renata para liberar o seu acesso.`; mostrar("vDenied"); return; }
  $("#who").textContent = (data.nome?data.nome+" · ":"")+session.user.email;
  mostrar("vApp"); $("#main").innerHTML='<div class="empty">Carregando…</div>';
  await carregar(); render();
}

$("#fLogin").addEventListener("submit", async e=>{
  e.preventDefault(); const m=$("#loginMsg");
  const {data,error}=await sb.auth.signInWithPassword({email:$("#lEmail").value.trim(),password:$("#lPass").value});
  if(error){ msg(m, error.message.includes("Invalid")?"E-mail ou senha incorretos.":error.message); return; }
  m.className="msg hidden"; entrar(data.session);
});
$("#lForgot").addEventListener("click", async ()=>{
  const m=$("#loginMsg"), email=$("#lEmail").value.trim();
  if(!email){ msg(m,"Digite seu e-mail acima e clique de novo em “Esqueci minha senha”."); return; }
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo: location.origin+location.pathname});
  msg(m, error?error.message:"Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.", error?"err":"info");
});
$("#fPass").addEventListener("submit", async e=>{
  e.preventDefault(); const m=$("#passMsg");
  if($("#pNew").value!==$("#pNew2").value){ msg(m,"As senhas não são iguais."); return; }
  const {error}=await sb.auth.updateUser({password:$("#pNew").value});
  if(error){ msg(m,error.message); return; }
  modoSenha=false; history.replaceState(null,"",location.pathname);
  const {data}=await sb.auth.getSession(); entrar(data.session);
});
async function sair(){ await sb.auth.signOut(); S.pacientes=[];S.casos=[];S.sessoes=[]; mostrar("vLogin"); }
$("#bOut").addEventListener("click", sair); $("#dOut").addEventListener("click", sair);

sb.auth.onAuthStateChange((ev, session)=>{ if(ev==="PASSWORD_RECOVERY"){ modoSenha=true; mostrar("vPass"); } if(ev==="SIGNED_OUT") mostrar("vLogin"); });
sb.auth.getSession().then(({data})=>entrar(data.session));

</script>
